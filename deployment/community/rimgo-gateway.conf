worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=rimgo_pages:2m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=rimgo_media:2m rate=8r/s;
  limit_conn_zone $binary_remote_addr zone=rimgo_connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  server {
    listen 8080;
    client_max_body_size 1k;
    limit_conn rimgo_connections 24;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    proxy_set_header Host rimgo.utilibre.org;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_hide_header Set-Cookie;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 30s;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location ~* (^/static/|\.(jpg|jpeg|png|gif|webp|avif|mp4|webm)$|/(avatar|cover)$) {
      limit_req zone=rimgo_media burst=48 nodelay;
      proxy_pass http://172.29.90.10:3000;
    }
    location / {
      limit_req zone=rimgo_pages burst=16 nodelay;
      proxy_pass http://172.29.90.10:3000;
    }
  }
}
