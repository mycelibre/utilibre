name: utilibre-collaboration-pilot
services:
  wbo:
    profiles: [pilot]
    image: utilibre-wbo:2.9.0-p2
    build:
      context: /opt/utilibre/src/whitebophir
      dockerfile: /home/ubuntu/freetools/deployment/community/wbo/Dockerfile
      additional_contexts: {integration: /home/ubuntu/freetools/deployment/community/wbo}
    restart: "no"
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m,uid=1000,gid=1000
      # Temporary pilot: upstream files persist across disconnection, not
      # container stops/recreation. Disclose this before any public access.
      - /opt/app/server-data:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000
    environment:
      WBO_MAX_ITEM_COUNT: "256"
      WBO_MAX_CHILDREN: "128"
      WBO_MAX_BOARD_SIZE: "8192"
      WBO_MAX_EMIT_COUNT: "*:250/5s"
      WBO_MAX_CONSTRUCTIVE_ACTIONS_PER_IP: "*:40/10s"
      WBO_MAX_DESTRUCTIVE_ACTIONS_PER_IP: "*:190/60s"
      WBO_IP_SOURCE: remoteAddress
      WBO_TRUST_PROXY_HOPS: "0"
      WBO_HTML_HEAD_SNIPPET_PATH: /opt/app/utilibre-head.html
      OTEL_SDK_DISABLED: "true"
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      LOG_LEVEL: warn
    logging: {driver: none}
    networks:
      isolated: {ipv4_address: 172.29.95.10}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
  gateway:
    profiles: [pilot]
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    entrypoint: [nginx, -g, "daemon off;"]
    restart: "no"
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=8m"]
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 32
    volumes:
      - ./wbo/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    ports: ["${UTILIBRE_COLLAB_BIND_IP:-127.0.0.1}:3169:8080"]
    networks:
      front: {ipv4_address: 172.29.94.10}
      isolated: {ipv4_address: 172.29.95.20}
    depends_on: [wbo]
    logging: {driver: none}
networks:
  isolated:
    internal: true
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.95.0/24}]}
  front:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.94.0/24}]}
