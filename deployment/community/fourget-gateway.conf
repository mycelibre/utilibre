worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  absolute_redirect off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=fourget_pages:2m rate=10r/m;
  limit_req_zone $server_name zone=fourget_global:1m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=fourget_media:1m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=fourget_connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level notice;
  limit_conn_log_level notice;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 16k;
    limit_conn fourget_connections 32;
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location ~ ^/(api|data|lib|docker|scraper|\.git)(/|\.|$) { return 403; }
    location ~ ^/(static/|icons/|proxy(\.php)?$|favicon(\.php)?$) {
      limit_req zone=fourget_media burst=80 nodelay;
      set $backend http://fourget:8080;
      proxy_pass $backend;
      proxy_set_header Host 4get.utilibre.org;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Authorization "";
      proxy_redirect http://4get.utilibre.org/ https://4get.utilibre.org/;
      proxy_hide_header X-Error;
      proxy_read_timeout 35s;
      proxy_max_temp_file_size 0;
      limit_rate 512k;
    }
    location / {
      limit_req zone=fourget_pages burst=8 nodelay;
      limit_req zone=fourget_global burst=6;
      set $backend http://fourget:8080;
      proxy_pass $backend;
      proxy_set_header Host 4get.utilibre.org;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Authorization "";
      proxy_redirect http://4get.utilibre.org/ https://4get.utilibre.org/;
      proxy_read_timeout 35s;
      proxy_max_temp_file_size 0;
    }
  }
}
