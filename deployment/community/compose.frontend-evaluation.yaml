# Private compatibility tests only. Do not change these bindings to 0.0.0.0.
# Old upstream runtimes and unrestricted proxy routes require review before launch.
name: utilibre-reader-evaluation
x-runtime: &runtime
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "65534:65534"
  pids_limit: 128
  mem_limit: 256m
  cpus: 1
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
  logging: {driver: none}
services:
  fourget:
    <<: *runtime
    image: utilibre-4get:03ba5d7-p1
    user: "100:101"
    ports: ["127.0.0.1:3145:8080"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
      - /var/www/html/4get/icons:rw,nosuid,nodev,noexec,size=16m,mode=1777
    networks:
      fourget: {ipv4_address: 172.29.79.10}
  safetwitch-backend:
    <<: *runtime
    image: codeberg.org/safetwitch/safetwitch-backend@sha256:d9e5de75f5917438ad4d1e3e46b77d4fd6074272173eab0ef10ed0e73a1c93f8
    environment: {PORT: "7000", URL: "http://127.0.0.1:3146", GIN_MODE: release}
    networks:
      twitch: {ipv4_address: 172.29.80.10}
  safetwitch:
    <<: *runtime
    image: utilibre-safetwitch-evaluation:caeb85a-p1
    build:
      context: .
      dockerfile: Dockerfile.safetwitch-evaluation
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["127.0.0.1:3146:8080"]
    volumes: ["./safetwitch-evaluation.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [safetwitch-backend]
    networks: [twitch]
  anonymousoverflow:
    <<: *runtime
    image: ghcr.io/httpjamesm/anonymousoverflow@sha256:1c48541f6d32faa97e0e4bfcc916c7993520271a496ad02454b5496ea5ef5a4b
    env_file: /opt/utilibre/community-data/overflow-private/runtime.env
    environment: {APP_URL: "http://127.0.0.1:3147", SCRAPER: api, GIN_MODE: release}
    ports: ["127.0.0.1:3147:8080"]
    healthcheck: {disable: true}
    networks:
      overflow: {ipv4_address: 172.29.81.10}
  gothub:
    <<: *runtime
    image: codeberg.org/gothub/gothub@sha256:d6ac0ba6e669d70b67f41dd4f64c53b35faf055f76790f9069642d611a3bd994
    environment:
      DOCKER: "true"
      GOTHUB_SETUP_COMPLETE: "true"
      GOTHUB_PROXYING_ENABLED: "true"
      GOTHUB_IP_LOGGED: "false"
      GOTHUB_REQUEST_URL_LOGGED: "false"
      GOTHUB_USER_AGENT_LOGGED: "false"
      GOTHUB_DIAGNOSTIC_INFO_LOGGED: "false"
      GOTHUB_INSTANCE_PRIVACY_POLICY: https://utilibre.org/en/privacy
      GOTHUB_INSTANCE_COUNTRY: Germany
      GOTHUB_INSTANCE_PROVIDER: Hetzner
      GOTHUB_INSTANCE_CLOUDFLARE: "true"
    ports: ["127.0.0.1:3148:3000"]
    networks:
      gothub: {ipv4_address: 172.29.82.10}
networks:
  fourget:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.79.0/24}]}
  twitch:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.80.0/24}]}
  overflow:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.81.0/24}]}
  gothub:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.82.0/24}]}
