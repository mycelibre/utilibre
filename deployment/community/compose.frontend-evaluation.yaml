# Reviewed reader gateways bind the app LAN and accept only the Caddy VM.
# All four readers passed bounded backend content/playback checks.
name: utilibre-reader-evaluation
x-runtime: &runtime
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "65534:65534"
  pids_limit: 128
  mem_limit: 256m
  cpus: 1
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
  logging: {driver: none}
services:
  fourget:
    <<: *runtime
    restart: unless-stopped
    image: utilibre-4get:03ba5d7-p2
    user: "100:101"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
      - /var/www/html/4get/icons:rw,nosuid,nodev,noexec,size=16m,mode=1777
    networks:
      fourget: {ipv4_address: 172.29.79.10}
  fourget-gateway:
    <<: *runtime
    restart: unless-stopped
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["10.10.1.43:3145:8080"]
    volumes:
      - ./fourget-gateway.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    networks:
      fourget: {ipv4_address: 172.29.79.20}
    depends_on: [fourget]
  safetwitch-backend:
    <<: *runtime
    restart: unless-stopped
    image: utilibre-safetwitch-backend:91dda1c-p1
    mem_limit: 512m
    environment: {PORT: "7000", URL: "https://twitch.utilibre.org", GIN_MODE: release, UTILIBRE_CHAT_ENABLED: "false", GOMEMLIMIT: 256MiB}
    networks:
      twitch: {ipv4_address: 172.29.80.10}
  safetwitch:
    <<: *runtime
    restart: unless-stopped
    image: utilibre-safetwitch:caeb85a-p1
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["10.10.1.43:3146:8080"]
    volumes:
      - ./safetwitch-evaluation.conf:/etc/nginx/nginx.conf:ro
      - ../toolbox/language.html:/srv/language/language.html:ro
      - ../toolbox/language.js:/srv/language/language.js:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"]
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
    depends_on: [safetwitch-backend]
    networks:
      twitch: {ipv4_address: 172.29.80.20}
  anonymousoverflow:
    <<: *runtime
    restart: unless-stopped
    image: utilibre-anonymousoverflow:937cfee-p1
    env_file: /opt/utilibre/community-data/overflow-private/runtime.env
    environment: {APP_URL: "https://overflow.utilibre.org", SCRAPER: api, GIN_MODE: release, DISABLE_RATELIMIT: "true"}
    healthcheck: {disable: true}
    networks:
      overflow: {ipv4_address: 172.29.81.10}
  anonymousoverflow-gateway:
    <<: *runtime
    restart: unless-stopped
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["10.10.1.43:3147:8080"]
    volumes:
      - ./anonymousoverflow-gateway.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    networks:
      overflow: {ipv4_address: 172.29.81.20}
    depends_on: [anonymousoverflow]
  gothub:
    <<: *runtime
    image: utilibre-gothub:24bedc8-p1
    restart: unless-stopped
    environment:
      DOCKER: "true"
      GOTHUB_SETUP_COMPLETE: "true"
      GOTHUB_PROXYING_ENABLED: "true"
      GOTHUB_IP_LOGGED: "false"
      GOTHUB_REQUEST_URL_LOGGED: "false"
      GOTHUB_USER_AGENT_LOGGED: "false"
      GOTHUB_DIAGNOSTIC_INFO_LOGGED: "false"
      GOTHUB_INSTANCE_PRIVACY_POLICY: https://utilibre.org/en/privacy
      GOTHUB_INSTANCE_COUNTRY: Germany
      GOTHUB_INSTANCE_PROVIDER: Hetzner
      GOTHUB_INSTANCE_CLOUDFLARE: "true"
    networks:
      gothub: {ipv4_address: 172.29.82.10}
  gothub-gateway:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    restart: unless-stopped
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["10.10.1.43:3148:8080"]
    volumes:
      - ./gothub-gateway.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    networks:
      gothub: {ipv4_address: 172.29.82.20}
    depends_on: [gothub]
networks:
  fourget:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.79.0/24}]}
  twitch:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.80.0/24}]}
  overflow:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.81.0/24}]}
  gothub:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.82.0/24}]}
