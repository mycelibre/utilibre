worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 192; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  absolute_redirect off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_zone $binary_remote_addr zone=binternet_search:1m rate=10r/m;
  limit_req_zone $server_name zone=binternet_global:1m rate=1r/s;
  limit_req_zone $binary_remote_addr zone=binternet_images:2m rate=12r/s;
  limit_conn_zone $binary_remote_addr zone=binternet_conn:1m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level notice;
  limit_conn_log_level notice;
  server {
    # Discover the verified, canonical Utilibre security contact.
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    listen 8080;
    # Public mirror pages request exclusion from indexing; this is not access control.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
      default_type text/plain;
      return 200 "User-agent: *\nAllow: /\nDisallow: /api/\nDisallow: /settings\nDisallow: /utilibre-source/\n";
    }
    root /app;
    index index.php;
    client_max_body_size 1k;
    limit_conn binternet_conn 32;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Onion-Location "http://ued2jl2ahvngdegugysin2fa6malo6omyf33j5tpfgex47erv453wbad.onion$request_uri" always;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location ~ ^/(static/|misc/.*\.css$) { try_files $uri =404; }
    location ~ ^/(index|search|image_proxy|donate)\.php$ {
      set $php binternet:9000;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app$fastcgi_script_name;
      fastcgi_param HTTP_HOST binternet.utilibre.org;
      fastcgi_param HTTPS on;
      fastcgi_param HTTP_AUTHORIZATION "";
      fastcgi_param HTTP_COOKIE "";
      fastcgi_pass $php;
      fastcgi_read_timeout 30s;
      fastcgi_max_temp_file_size 0;
      fastcgi_hide_header X-Powered-By;
      fastcgi_hide_header Set-Cookie;
      limit_req zone=binternet_images burst=100 nodelay;
      limit_rate 1m;
    }
    location = /search.php {
      limit_req zone=binternet_search burst=5 nodelay;
      limit_req zone=binternet_global burst=3;
      set $php binternet:9000;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app/search.php;
      fastcgi_param HTTP_HOST binternet.utilibre.org;
      fastcgi_param HTTPS on;
      fastcgi_param HTTP_AUTHORIZATION "";
      fastcgi_param HTTP_COOKIE "";
      fastcgi_pass $php;
      fastcgi_read_timeout 30s;
      fastcgi_max_temp_file_size 0;
      fastcgi_hide_header X-Powered-By;
      fastcgi_hide_header Set-Cookie;
    }
    location = / { rewrite ^ /index.php last; }
    location / { return 404; }
  }
}
