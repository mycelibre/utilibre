worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=lyrics_pages:2m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=lyrics_assets:2m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=lyrics_connections:1m;
  limit_req_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  proxy_cache_path /tmp/page-cache keys_zone=lyrics_cache:2m max_size=16m inactive=20m use_temp_path=off;
  server {
    listen 8080;
    client_max_body_size 1k;
    limit_conn lyrics_connections 12;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header X-Frame-Options DENY always;
    location ~ ^/assets/ {
      limit_req zone=lyrics_assets burst=50 nodelay;
      set $backend http://dumb:5555;
      proxy_pass $backend;
      proxy_set_header Host lyrics.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_max_temp_file_size 0;
      limit_rate 1m;
      proxy_read_timeout 25s;
    }
    location / {
      limit_req zone=lyrics_pages burst=20 nodelay;
      set $backend http://dumb:5555;
      proxy_pass $backend;
      proxy_set_header Host lyrics.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      # LRCLIB adapter handles its bounded RAM cache. Never edge-cache searches.
      proxy_cache off;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 25s;
    }
  }
}
