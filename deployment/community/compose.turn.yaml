name: utilibre-turn-option
x-turn: &turn
  image: utilibre-coturn:bson-reserve-security-20261028
  build: {context: ./turn}
  user: "65534:65534"
  entrypoint: [turnserver, -c, /run/config/turnserver.conf]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 128m
  cpus: 0.5
  pids_limit: 64
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=8m", "/var/lib/coturn:rw,nosuid,nodev,noexec,size=8m"]
  network_mode: host
  logging: {driver: none}
services:
  turn-lab:
    <<: *turn
    profiles: [lab]
    restart: "no"
    volumes: ["/opt/utilibre/turn-lab/turnserver.conf:/run/config/turnserver.conf:ro"]
  turn:
    <<: *turn
    # Dedicated UID makes host-network egress filtering independent of Galene.
    user: "4005:4005"
    profiles: [public-turn]
    restart: unless-stopped
    volumes:
      - /opt/utilibre/turn/turnserver.conf:/run/config/turnserver.conf:ro
      - /opt/utilibre/turn/certs:/certs:ro
    healthcheck:
      test: [CMD, turnutils_stunclient, -p, "3479", "${UTILIBRE_TURN_BIND_IP:-10.10.1.43}"]
      interval: 60s
      timeout: 5s
      retries: 3
