worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=fmd_api:2m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=fmd_assets:2m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=fmd_connections:1m;
  limit_req_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 15m;
    client_body_timeout 30s;
    limit_conn fmd_connections 12;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    location = /metrics { return 404; }
    # Only immutable-named frontend files get the shared-network burst budget.
    # Account, location, command and other API traffic keeps the original limit.
    location ~ ^/assets/[A-Za-z0-9_.-]+\.(?:js|css|woff2?|png|svg|ico)$ {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      limit_req zone=fmd_assets burst=100 nodelay;
      set $backend http://fmd:8080;
      proxy_pass $backend;
      proxy_set_header Host fmd.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 30s;
      proxy_max_temp_file_size 0;
    }
    location / {
      limit_req zone=fmd_api burst=60 nodelay;
      set $backend http://fmd:8080;
      proxy_pass $backend;
      proxy_set_header Host fmd.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 60s;
      proxy_max_temp_file_size 0;
    }
  }
}
