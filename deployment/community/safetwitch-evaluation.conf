worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  absolute_redirect off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=twitch_api:2m rate=4r/s;
  limit_req_zone $server_name zone=twitch_api_global:1m rate=4r/s;
  limit_req_zone $binary_remote_addr zone=twitch_media:2m rate=8r/s;
  limit_req_zone $server_name zone=twitch_media_global:1m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  limit_conn_zone $server_name zone=global_connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level notice;
  limit_conn_log_level notice;
  proxy_cache_path /tmp/cache keys_zone=twitch_cache:1m max_size=16m inactive=2m;
  map "$request_method:$uri" $allowed_method {
    default 0;
    ~^(GET|HEAD): 1;
    "POST:/api/users/isLive/bulk" 1;
    "POST:/api/users/followingStreamer/bulk" 1;
  }
  server {
    listen 8080;
    root /app;
    client_max_body_size 16k;
    limit_conn connections 48;
    limit_conn global_connections 96;
    if ($allowed_method = 0) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /utilibre-language.html { alias /srv/language/language.html; }
    location = /utilibre-language.js { alias /srv/language/language.js; }
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location ~ (^/ws/|/\.) { return 404; }
    location ^~ /api/chat { return 403; }
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
      limit_req zone=twitch_api burst=20 nodelay;
      limit_req zone=twitch_api_global burst=20;
      set $backend http://safetwitch-backend:7000;
      proxy_pass $backend;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header Host twitch.utilibre.org;
      proxy_cache twitch_cache;
      proxy_cache_valid 200 30s;
      proxy_cache_lock on;
      proxy_cache_key $request_uri;
      proxy_read_timeout 30s;
      proxy_max_temp_file_size 0;
    }
    location /proxy/ {
      limit_req zone=twitch_media burst=120 nodelay;
      limit_req zone=twitch_media_global burst=120;
      set $backend http://safetwitch-backend:7000;
      proxy_pass $backend;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header Host twitch.utilibre.org;
      proxy_read_timeout 30s;
      proxy_max_temp_file_size 0;
      limit_rate 1m;
    }
  }
}
