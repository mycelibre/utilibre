worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_zone $binary_remote_addr zone=readers:1m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  server {
    listen 8080;
    root /app;
    client_max_body_size 1k;
    limit_conn connections 8;
    limit_req zone=readers burst=20 nodelay;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/(api|proxy|ws)/ {
      set $backend http://safetwitch-backend:7000;
      proxy_pass $backend;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 20s;
      proxy_max_temp_file_size 0;
      limit_rate 1m;
    }
  }
}
