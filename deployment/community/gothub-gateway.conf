worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=github_pages:2m rate=20r/m;
  limit_req_zone $binary_remote_addr zone=github_assets:1m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=github_connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level notice;
  limit_conn_log_level notice;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 1k;
    limit_conn github_connections 20;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Covers cache hits as well as responses that traverse the app middleware.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; script-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; connect-src 'self'" always;
    # Public reader only: no Git smart protocol or large archive hosting.
    location ~ /(git-upload-pack|git-receive-pack|info/refs|archive)(/|$) { return 403; }
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location ~ ^/(css/|avatar/|logo\.svg$|favicon\.ico$) {
      limit_req zone=github_assets burst=30 nodelay;
      set $backend http://gothub:3000;
      proxy_pass $backend;
      proxy_set_header Host gothub.utilibre.org;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_hide_header Set-Cookie;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 25s;
    }
    location / {
      limit_req zone=github_pages burst=12 nodelay;
      set $backend http://gothub:3000;
      proxy_pass $backend;
      proxy_set_header Host gothub.utilibre.org;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_hide_header Set-Cookie;
      proxy_read_timeout 25s;
      proxy_max_temp_file_size 0;
      limit_rate 1m;
    }
  }
}
