worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  fastcgi_temp_path /tmp/fastcgi;
  proxy_temp_path /tmp/proxy;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Real-IP;
  limit_req_zone $binary_remote_addr zone=feeds:1m rate=6r/m;
  limit_req_status 429;
  server {
    listen 8080;
    root /app;
    index index.php;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /index.php {
      limit_req zone=feeds burst=8 nodelay;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app/index.php;
      fastcgi_pass unix:/run/php/rssbridge.sock;
      fastcgi_read_timeout 45s;
    }
    location ~ ^/(static|css|js|img)/ { try_files $uri =404; }
    location = / { rewrite ^ /index.php last; }
    location = /favicon.ico { try_files $uri =404; }
    location / { return 404; }
  }
}
