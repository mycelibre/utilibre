expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 128M
max_execution_time = 30
post_max_size = 128K
upload_max_filesize = 1K
file_uploads = Off
allow_url_fopen = Off
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = Lax
session.save_path = /app/var/sessions
opcache.enable = 1
opcache.validate_timestamps = 0
date.timezone = UTC
