worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=search:2m rate=20r/m;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map "$request_method:$uri" $blocked_post {
    default 0;
    ~^POST:/(search|nojs/search|api/(search(/retry)?|suggest|lucky|tab-search|slots(/glance)?|command))$ 0;
    ~^POST: 1;
  }
  server {
    # Discover the verified, canonical Utilibre security contact.
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    listen 8080;
    # Public mirror pages request exclusion from indexing; this is not access control.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
      default_type text/plain;
      return 200 "User-agent: *\nAllow: /\nDisallow: /api/\nDisallow: /settings\nDisallow: /utilibre-source/\n";
    }
    client_max_body_size 256k;
    client_body_timeout 10s;
    limit_conn connections 12;
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    if ($blocked_post) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Keep DeGoog's own nonce-based CSP; do not replace it with unsafe-inline.
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    # Native public-instance settings only: preferences stay in this browser.
    # Exact routes take precedence over the operator-route deny below.
    location = /settings {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      set $backend http://degoog:4444;
      proxy_pass $backend;
      proxy_set_header Host degoog.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Authorization "";
    }
    location = /settings/ { return 308 /settings; }
    # These four upstream endpoints deliberately expose only public UI defaults.
    location ~ ^/api/settings/(appearance|tab-order|languages|streaming)$ {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      set $backend http://degoog:4444;
      proxy_pass $backend;
      proxy_set_header Host degoog.utilibre.org;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
    }
    # No native favicon provider is configured. Preserve its normal 404/letter
    # fallback without consuming app connections for every search result.
    # Remove this exact guard if a reviewed native favicon provider is enabled.
    location = /api/proxy/favicon { return 404; }
    # Operator APIs stay on the loopback listener, even with a valid password.
    location ~ ^/(settings|setup|api/(settings|setup|store|indexer|compat|themes|favicon/refresh))(/|$) { return 404; }
    location ~ ^/api/(extensions|plugins)/.+ { return 404; }
    location ~ ^/(api/(search|search-stream|tab-search|lucky|command)|search|nojs/search)(/|$) {
      limit_req zone=search burst=10 nodelay;
      set $backend http://degoog:4444;
      proxy_pass $backend;
      proxy_set_header Host degoog.utilibre.org;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Authorization "";
      proxy_buffering off;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 35s;
      proxy_connect_timeout 5s;
    }
    location / {
      set $backend http://degoog:4444;
      proxy_pass $backend;
      proxy_set_header Host degoog.utilibre.org;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Authorization "";
      proxy_max_temp_file_size 0;
      proxy_read_timeout 35s;
      proxy_connect_timeout 5s;
    }
  }
}
