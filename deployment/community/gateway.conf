worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  absolute_redirect off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Real-IP;
  limit_req_zone $binary_remote_addr zone=secrets:1m rate=10r/m;
  limit_req_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    # Discover the verified, canonical Utilibre security contact.
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    listen 8082;
    client_max_body_size 16k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    set $secret_backend http://yopass:1337;
    location = /utilibre-language.html { alias /srv/utilibre-language/language.html; }
    location = /utilibre-language.js { alias /srv/utilibre-language/language.js; }
    location ~ ^/(create/secret/?$|secret(?:/|$)) {
      limit_req zone=secrets burst=10 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass $secret_backend;
    }
    location /file { return 404; }
    location / {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass $secret_backend;
    }
  }
  server {
    # Discover the verified, canonical Utilibre security contact.
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    listen 8085;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    set $status_backend http://uptime-kuma:3001;
    location = /utilibre-language.html { alias /srv/utilibre-language/language.html; }
    location = /utilibre-language.js { alias /srv/utilibre-language/language.js; }
    location = / { return 302 /status/utilibre; }
    location ~ ^/(status/utilibre/?$|api/status-page/(heartbeat/)?utilibre(/(manifest\.json|incident-history|badge))?$|assets/|icon\.svg$|favicon\.ico$|manifest\.json$) {
      proxy_set_header Host $host;
      proxy_pass $status_backend;
    }
    # No setup, dashboard, metrics or administrative WebSocket routes publicly.
    location / { return 404; }
  }
}
