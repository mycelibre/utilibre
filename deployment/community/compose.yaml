name: utilibre-community

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 96
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  rssbridge:
    ulimits: {core: 0}
    memswap_limit: 256m
    <<: *runtime
    # Same upstream app; staged Debian 12 security package refresh (see maintenance runbook).
    image: utilibre-rssbridge:php-security-20261022
    user: "33:33"
    entrypoint: [/bin/sh, -ec]
    command: ["mkdir -p /run/php; nginx -c /etc/nginx/utilibre.conf; exec php-fpm8.2 --fpm-config /etc/php/8.2/fpm/utilibre.conf --nodaemonize"]
    volumes:
      - ./rssbridge.ini.php:/app/config.ini.php:ro
      - ./rssbridge-nginx.conf:/etc/nginx/utilibre.conf:ro
      - ./rssbridge-fpm.conf:/etc/php/8.2/fpm/utilibre.conf:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
      - /run:rw,nosuid,nodev,noexec,size=16m,mode=1777
      - /app/cache:rw,nosuid,nodev,noexec,size=128m,uid=33,gid=33
    networks:
      feeds: {ipv4_address: 172.29.70.10}
    ports: ["10.10.1.43:3120:8080"]
    healthcheck:
      test: [CMD, php, -r, "exit(file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3

  ntfy:
    ulimits: {core: 0}
    memswap_limit: 256m
    <<: *runtime
    image: utilibre-ntfy:2.28.0-go-security-20261011
    user: "1000:1000"
    command: [serve]
    volumes: ["./ntfy.yml:/etc/ntfy/server.yml:ro"]
    networks: [front]
    ports: ["10.10.1.43:3121:8080"]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/v1/health]
      interval: 30s
      timeout: 5s
      retries: 3

  yopass:
    ulimits: {core: 0}
    memswap_limit: 256m
    <<: *runtime
    image: utilibre-yopass:14.10.0-go-openssl-security-20261011
    command: ["--database=redis", "--redis=redis://secret-cache:6379/0", "--disable-upload", "--force-onetime-secrets", "--force-expiration=1h", "--default-expiry=1h", "--max-length=10000", "--cors-allow-origin=https://secret.utilibre.org", "--privacy-notice-url=https://utilibre.org/en/privacy"]
    networks: [secrets]
    depends_on: [secret-cache]
    healthcheck:
      test: [CMD, /yopass-server, --health-check, --database=redis, --redis=redis://secret-cache:6379/0]
      interval: 30s
      timeout: 5s
      retries: 3

  secret-cache:
    ulimits: {core: 0}
    memswap_limit: 96m
    <<: *runtime
    image: utilibre-valkey:9.1.1-vendor-security-20261011
    user: "999:1000"
    command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, noeviction, --loglevel, warning]
    tmpfs: ["/data:rw,nosuid,nodev,noexec,size=8m,uid=999,gid=1000"]
    mem_limit: 96m
    networks: [secrets]

  pairdrop:
    ulimits: {core: 0}
    memswap_limit: 256m
    <<: *runtime
    logging: {driver: none}
    image: utilibre-pairdrop:1.11.2-security-20261011-p4
    user: "1000:1000"
    environment:
      PORT: "3000"
      RATE_LIMIT: "1"
      DEBUG_MODE: "false"
      WS_FALLBACK: "false"
      RTC_CONFIG: /config/rtc.json
      IPV6_LOCALIZE: "4"
      PRIVACYPOLICY_BUTTON_ACTIVE: "true"
      PRIVACYPOLICY_BUTTON_LINK: https://utilibre.org/en/privacy
      CUSTOM_BUTTON_ACTIVE: "true"
      CUSTOM_BUTTON_LINK: https://utilibre.org/
      CUSTOM_BUTTON_TITLE: "Más herramientas de Utilibre / More tools from Utilibre"
    volumes:
      - ./pairdrop-rtc.json:/config/rtc.json:ro
      - ../toolbox/language.html:/home/node/app/public/utilibre-language.html:ro
      - ../toolbox/language.js:/home/node/app/public/utilibre-language.js:ro
    networks: [front]
    ports: ["10.10.1.43:3124:3000"]

  uptime-kuma:
    <<: *runtime
    # Same app version; native SQLite/HTTP/TCP checks need no bundled Chromium/MariaDB.
    image: utilibre-kuma:redirects1161-security-20261022
    user: "1000:1000"
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
      UPTIME_KUMA_HOST: 0.0.0.0
      UPTIME_KUMA_PORT: "3001"
    # Verified HTTPS liveness through the edge. The public-IP route cannot be
    # reached from this VM; the status page explicitly labels this exception.
    extra_hosts: ["search.utilibre.org:10.10.1.3"]
    volumes: ["/opt/utilibre/community-data/kuma:/app/data"]
    networks: [front]
    # Administration is localhost-only. Public status uses the restricted gateway.
    ports: ["127.0.0.1:3135:3001"]
    mem_limit: 512m
    cpus: 1

  gateway:
    <<: *runtime
    image: utilibre-nginx:1.30.6-security-20261022
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./gateway.conf:/etc/nginx/nginx.conf:ro
      - ../toolbox/language.html:/srv/utilibre-language/language.html:ro
      - ../toolbox/language.js:/srv/utilibre-language/language.js:ro
    ports: ["10.10.1.43:3122:8082", "10.10.1.43:3125:8085"]
    networks: [front, secrets]
    depends_on: [yopass, uptime-kuma]

  rallly:
    <<: *runtime
    profiles: [rallly]
    image: utilibre-rallly:4.15.4-next1641-security-20261022
    environment:
      DATABASE_URL: postgres://rallly:${RALLLY_DB_PASSWORD:-UNCONFIGURED}@rallly-db:5432/rallly
      SECRET_PASSWORD: ${RALLLY_SECRET_PASSWORD:-UNCONFIGURED}
      NEXT_PUBLIC_BASE_URL: https://poll.utilibre.org
      SUPPORT_EMAIL: admin@utilibre.org
      INITIAL_ADMIN_EMAIL: admin@utilibre.org
      NOREPLY_EMAIL: no-reply@utilibre.org
      # OIDC provisions accounts only after authentik's approved-group policy.
      # The gateway blocks alternative authentication APIs, not just their UI.
      REGISTRATION_ENABLED: "true"
      EMAIL_LOGIN_ENABLED: "false"
      OIDC_NAME: Utilibre
      OIDC_DISCOVERY_URL: https://auth.utilibre.org/application/o/rallly/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${RALLLY_OIDC_CLIENT_ID:-UNCONFIGURED}
      OIDC_CLIENT_SECRET: ${RALLLY_OIDC_CLIENT_SECRET:-UNCONFIGURED}
      SMTP_HOST: mx.mailgt.dev
      SMTP_PORT: "26"
      SMTP_SECURE: "false"
      SMTP_REJECT_UNAUTHORIZED: "true"
      SMTP_DEBUG: "false"
      RATE_LIMIT_ENABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    extra_hosts: ["mx.mailgt.dev:10.10.1.20"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /app/apps/web/.next/cache:rw,nosuid,nodev,noexec,size=64m,uid=1001,gid=1001
    networks: [polls, poll-egress]
    depends_on:
      rallly-db: {condition: service_healthy}
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3

  rallly-gateway:
    <<: *runtime
    profiles: [rallly]
    image: utilibre-nginx:1.30.6-security-20261022
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./rallly-gateway.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    ports: ["10.10.1.43:3123:8080"]
    networks: [front, polls]
    depends_on:
      rallly: {condition: service_healthy}

  rallly-db:
    <<: *runtime
    profiles: [rallly]
    image: utilibre-postgres:17.11-alpine-gosu-security-20261011-p2
    user: "70:70"
    environment:
      POSTGRES_USER: rallly
      POSTGRES_DB: rallly
      POSTGRES_PASSWORD: ${RALLLY_DB_PASSWORD:-UNCONFIGURED}
    volumes: ["/opt/utilibre/community-data/rallly-db:/var/lib/postgresql/data"]
    tmpfs: ["/var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,uid=70,gid=70"]
    networks: [polls]
    mem_limit: 256m
    healthcheck:
      test: [CMD, pg_isready, -U, rallly]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  feeds:
    ipam: {config: [{subnet: 172.29.70.0/24}]}
  front: {}
  secrets: {internal: true}
  polls: {internal: true}
  poll-egress: {}
