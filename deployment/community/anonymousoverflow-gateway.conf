worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=overflow_pages:2m rate=15r/m;
  limit_req_zone $server_name zone=overflow_global:1m rate=1r/s;
  limit_req_zone $binary_remote_addr zone=overflow_assets:1m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=overflow_connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level notice;
  limit_conn_log_level notice;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 8k;
    limit_conn overflow_connections 16;
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location /health { return 404; }
    location ~ ^/(static/|proxy$) {
      limit_req zone=overflow_assets burst=50 nodelay;
      set $backend http://anonymousoverflow:8080;
      proxy_pass $backend;
      proxy_set_header Host overflow.utilibre.org;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Authorization "";
      proxy_hide_header Set-Cookie;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 25s;
      limit_rate 1m;
    }
    location / {
      limit_req zone=overflow_pages burst=8 nodelay;
      limit_req zone=overflow_global burst=6;
      set $backend http://anonymousoverflow:8080;
      proxy_pass $backend;
      proxy_set_header Host overflow.utilibre.org;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Authorization "";
      proxy_read_timeout 35s;
      proxy_max_temp_file_size 0;
    }
  }
}
