pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # Only the separate trusted edge may supply client addresses.
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=reads:1m rate=15r/s;
  map $request_method $write_client { default $binary_remote_addr; GET ""; HEAD ""; OPTIONS ""; }
  limit_req_zone $write_client zone=writes:1m rate=2r/s;
  server {
    listen 8080;
    server_name bookmarks.utilibre.org;
    client_max_body_size 10m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Native Markdown may contain remote images. Keep their requests on-device blocked.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://auth.utilibre.org" always;
    # Permit crawling of already-public responses so noindex can be observed.
    # Authentication and DAV/manager permissions still govern private content.
    location = /robots.txt {
      default_type text/plain;
      charset utf-8;
      return 200 "User-agent: *\nDisallow:\n";
    }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /admin/login/ { return 302 /oidc/authenticate/; }
    location / {
      limit_req zone=reads burst=90 nodelay;
      limit_req zone=writes burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://linkding:9090;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Forwarded "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }
  }
}
