worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  absolute_redirect off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  # Onion clients have no trustworthy individual IP. Apply shared budgets,
  # never visitor-supplied IP headers or one clearnet user's per-IP quota.
  limit_req_zone $server_name zone=onion_search:1m rate=30r/m;
  limit_req_zone $server_name zone=onion_images:1m rate=12r/s;
  limit_conn_zone $server_name zone=onion_connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level notice;
  limit_conn_log_level notice;
  server {
    listen unix:/run/onion/http.sock;
    root /app;
    client_max_body_size 1k;
    limit_conn onion_connections 32;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location ~ ^/(static/|misc/.*\.css$) { try_files $uri =404; }
    location ~ ^/(index|image_proxy|donate)\.php$ {
      set $php binternet-onion:9000;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app$fastcgi_script_name;
      fastcgi_param HTTP_AUTHORIZATION "";
      fastcgi_param HTTP_COOKIE "";
      fastcgi_param HTTP_X_FORWARDED_FOR "";
      fastcgi_param HTTP_X_REAL_IP "";
      fastcgi_pass $php;
      fastcgi_read_timeout 30s;
      fastcgi_max_temp_file_size 0;
      fastcgi_hide_header X-Powered-By;
      fastcgi_hide_header Set-Cookie;
      limit_req zone=onion_images burst=100 nodelay;
      limit_rate 256k;
    }
    location = /search.php {
      limit_req zone=onion_search burst=4;
      set $php binternet-onion:9000;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app/search.php;
      fastcgi_param HTTP_AUTHORIZATION "";
      fastcgi_param HTTP_COOKIE "";
      fastcgi_param HTTP_X_FORWARDED_FOR "";
      fastcgi_param HTTP_X_REAL_IP "";
      fastcgi_pass $php;
      fastcgi_read_timeout 30s;
      fastcgi_max_temp_file_size 0;
      fastcgi_hide_header X-Powered-By;
      fastcgi_hide_header Set-Cookie;
    }
    location = / { rewrite ^ /index.php last; }
    location / { return 404; }
  }
}
