# Public status routes only. Install as a separate Nginx site beside Nextcloud.
# HTTPS needs its own status.utilibre.org certificate before DNS cutover.
server {
    listen 80;
    server_name status.utilibre.org;
    access_log off;
    client_max_body_size 1k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location = / { return 302 /status/utilibre; }

    location = /status/utilibre {
        proxy_pass http://127.0.0.1:3001;
    }
    location ^~ /status/utilibre/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /api/status-page/utilibre {
        proxy_pass http://127.0.0.1:3001;
    }
    location ^~ /api/status-page/utilibre/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /api/status-page/heartbeat/utilibre {
        proxy_pass http://127.0.0.1:3001;
    }
    location ^~ /api/status-page/heartbeat/utilibre/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /icon.svg {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /manifest.json {
        proxy_pass http://127.0.0.1:3001;
    }
    location / { return 404; }
}
