# Install only after Certbot has issued this hostname's certificate.
# The HTTP site retains the webroot challenge for unattended renewal.
server {
    listen 80;
    server_name status.utilibre.org;
    access_log off;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 308 https://status.utilibre.org$request_uri; }
}

server {
    listen 443 ssl;
    server_name status.utilibre.org;
    ssl_certificate /etc/letsencrypt/live/status.utilibre.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.utilibre.org/privkey.pem;
    access_log off;
    client_max_body_size 1k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;

    location = / { return 302 /status/utilibre; }
    location = /status/utilibre {
        proxy_pass http://127.0.0.1:3001;
    }
    location ^~ /status/utilibre/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /api/status-page/utilibre {
        proxy_pass http://127.0.0.1:3001;
    }
    location ^~ /api/status-page/utilibre/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /api/status-page/heartbeat/utilibre {
        proxy_pass http://127.0.0.1:3001;
    }
    location ^~ /api/status-page/heartbeat/utilibre/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /icon.svg {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /manifest.json {
        proxy_pass http://127.0.0.1:3001;
    }
    location / { return 404; }
}
