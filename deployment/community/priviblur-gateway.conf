worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=tumblr_pages:2m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=tumblr_media:2m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=tumblr_connections:1m;
  limit_req_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 8k;
    limit_conn tumblr_connections 12;
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location ~ ^/(assets|tblr)/ {
      limit_req zone=tumblr_media burst=50 nodelay;
      set $tumblr_backend http://priviblur:8000;
      proxy_pass $tumblr_backend;
      proxy_set_header Host tumblr.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_hide_header Set-Cookie;
      proxy_max_temp_file_size 0;
      limit_rate 1m;
      proxy_read_timeout 25s;
    }
    location / {
      limit_req zone=tumblr_pages burst=20 nodelay;
      set $tumblr_backend http://priviblur:8000;
      proxy_pass $tumblr_backend;
      proxy_set_header Host tumblr.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 25s;
    }
  }
}
