# Compatibility override; identical to the native relay settings in compose.yaml.
services:
  rallly:
    environment:
      SUPPORT_EMAIL: admin@utilibre.org
      NOREPLY_EMAIL: no-reply@utilibre.org
      SMTP_HOST: mx.mailgt.dev
      SMTP_PORT: "26"
      SMTP_SECURE: "false"
      SMTP_REJECT_UNAUTHORIZED: "true"
      # Intentionally no SMTP_USER or SMTP_PWD: the relay has no authentication.
    extra_hosts: ["mx.mailgt.dev:10.10.1.20"]
