# Isolated quota fixtures, NOT production applications. The test verifies these
# sustained rates and bursts match reviewed production gateway definitions.
# No real upstreams, IP spoofing, TLS changes or user data; all responses local.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_status 429;
  limit_req_zone $server_name zone=translate_global:1m rate=40r/m;
  limit_req_zone $server_name zone=overflow_global:1m rate=1r/s;
  limit_req_zone $server_name zone=fourget_global:1m rate=2r/s;
  limit_req_zone $server_name zone=binternet_global:1m rate=1r/s;
  server { listen 127.0.0.1:3394; location / { return 200 'local synthetic response'; } }
  server {
    listen 127.0.0.1:3390; server_name translate;
    location / { limit_req zone=translate_global burst=20 nodelay; proxy_pass http://127.0.0.1:3394; }
  }
  server {
    listen 127.0.0.1:3391; server_name overflow;
    location / { limit_req zone=overflow_global burst=6; proxy_pass http://127.0.0.1:3394; }
  }
  server {
    listen 127.0.0.1:3392; server_name fourget;
    location / { limit_req zone=fourget_global burst=6; proxy_pass http://127.0.0.1:3394; }
  }
  server {
    listen 127.0.0.1:3393; server_name binternet;
    location / { limit_req zone=binternet_global burst=3; proxy_pass http://127.0.0.1:3394; }
  }
}
