name: utilibre-capacity-fixtures
services:
  quotas:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 32
    logging: {driver: none}
    entrypoint: [nginx, -g, "daemon off;"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    # All listeners AND the only upstream are explicitly loopback in nginx.conf.
    # No public listener, provider URL, resolver or arbitrary proxy target exists.
    network_mode: host
