worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=tenor_pages:2m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=tenor_media:2m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=tenor_connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level notice;
  limit_conn_log_level notice;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    # Discover the verified, canonical Utilibre security contact.
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    listen 8080;
    # Public mirror pages request exclusion from indexing; this is not access control.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
      default_type text/plain;
      return 200 "User-agent: *\nAllow: /\nDisallow: /api/\nDisallow: /settings\nDisallow: /utilibre-source/\n";
    }
    client_max_body_size 1k;
    # The native results grid loads 30 GIF thumbnails concurrently.
    limit_conn tenor_connections 48;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location = /proxy.gif {
      limit_req zone=tenor_media burst=50 nodelay;
      set $backend http://mezzo:8006;
      proxy_pass $backend;
      proxy_set_header Host tenor.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_max_temp_file_size 0;
      proxy_hide_header Set-Cookie;
      limit_rate 1m;
      proxy_read_timeout 35s;
    }
    location / {
      limit_req zone=tenor_pages burst=20 nodelay;
      set $backend http://mezzo:8006;
      proxy_pass $backend;
      proxy_set_header Host tenor.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 35s;
    }
  }
}
