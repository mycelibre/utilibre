worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=poll_requests:2m rate=10r/s;
  limit_req_status 429;
  map $arg_lang $utilibre_locale { default en; es es; }
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    # Discover the verified, canonical Utilibre security contact.
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    listen 8080;
    client_max_body_size 1m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # EMAIL_LOGIN_ENABLED hides the email UI but does not disable emailOTP.
    # This is an OIDC-only service: keep these paths unreachable from the edge.
    location ~* ^/api/(better-auth|auth)/(email-otp|sign-in/email|sign-up|forget-password|request-password-reset|reset-password|change-password|set-password|change-email)(/|$) {
      return 403;
    }
    # Object uploads are not configured for this scheduling-only pilot.
    location ^~ /api/storage/ { return 403; }
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location = /utilibre-language {
      add_header Set-Cookie "rallly_locale=$utilibre_locale; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=31536000" always;
      add_header Cache-Control no-store always;
      return 302 https://poll.utilibre.org/;
    }
    location / {
      limit_req zone=poll_requests burst=100 nodelay;
      set $poll_backend http://rallly:3000;
      proxy_pass $poll_backend;
      proxy_http_version 1.1;
      proxy_set_header Host poll.utilibre.org;
      proxy_set_header X-Forwarded-Host poll.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
    }
  }
}
