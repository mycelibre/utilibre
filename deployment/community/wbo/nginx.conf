worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_conn_zone $server_name zone=pilot:32k;
  map $uri $arrival_key {
    default $binary_remote_addr;
    ~^/(js|tools|css|images|fonts)/ "";
  }
  limit_req_zone $arrival_key zone=arrival:32k rate=5r/s;
  server {
    listen 8080;
    client_max_body_size 64k;
    limit_conn pilot 12;
    limit_conn_status 429;
    limit_req zone=arrival burst=50 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location / {
      proxy_pass http://wbo:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
      proxy_set_header Host $host;
      proxy_read_timeout 90s;
    }
  }
}
