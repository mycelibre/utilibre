worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  fastcgi_temp_path /tmp/fastcgi;
  proxy_temp_path /tmp/proxy;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $request_method $pollaris_write_key { default ""; POST $binary_remote_addr; }
  limit_req_zone $binary_remote_addr zone=pollaris_pages:2m rate=5r/s;
  limit_req_zone $pollaris_write_key zone=pollaris_writes:2m rate=12r/m;
  limit_conn_zone $binary_remote_addr zone=pollaris_connections:2m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level notice;
  limit_conn_log_level notice;
  server {
    # Discover the verified, canonical Utilibre security contact.
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    listen 8080;
    # Administrative access is loopback-only at the host, never in Caddy.
    listen 8081;
    server_name pollaris.utilibre.org;
    root /app/public;
    client_max_body_size 128k;
    limit_conn pollaris_connections 24;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # No executable PHP paths, development tools or private application files.
    location ~ ^/(login|logout|admin)(/|$) {
      if ($server_port = 8080) { return 404; }
      try_files /nonexistent /index.php$is_args$args;
    }
    location ~ ^/(\.|_profiler|_wdt|config|src|var|vendor|bin)(/|$) { return 404; }
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location = /utilibre-language.html { alias /srv/utilibre-language/language.html; }
    location = /utilibre-language.js { alias /srv/utilibre-language/language.js; }
    location ~* \.(css|js|map|woff2|png|svg|webp|ico)$ { try_files $uri =404; }
    location / {
      limit_except GET POST { deny all; }
      try_files $uri /index.php$is_args$args;
    }
    location = /index.php {
      internal;
      limit_req zone=pollaris_pages burst=30 nodelay;
      limit_req zone=pollaris_writes burst=12 nodelay;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app/public/index.php;
      fastcgi_param DOCUMENT_ROOT /app/public;
      fastcgi_param HTTPS on;
      fastcgi_param SERVER_PORT 443;
      fastcgi_param HTTP_HOST pollaris.utilibre.org;
      fastcgi_param SERVER_NAME pollaris.utilibre.org;
      fastcgi_param HTTP_X_FORWARDED_FOR "";
      fastcgi_param HTTP_X_FORWARDED_HOST "";
      fastcgi_param HTTP_X_FORWARDED_PROTO "";
      fastcgi_param HTTP_PROXY "";
      set $pollaris_backend pollaris:9000;
      fastcgi_pass $pollaris_backend;
      fastcgi_read_timeout 35s;
    }
    location ~ \.php(/|$) { return 404; }
  }
}
