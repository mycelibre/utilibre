name: utilibre-binternet
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 64
  logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
services:
  binternet:
    <<: *runtime
    image: utilibre-binternet:9bb70ef-p1
    user: "65534:65534"
    volumes: ["./binternet-fpm.conf:/etc/php84/utilibre-fpm.conf:ro"]
    networks:
      binternet: {ipv4_address: 172.29.85.10}
  gateway:
    <<: *runtime
    image: utilibre-binternet-gateway:9bb70ef-p1
    user: "101:101"
    ports: ["10.10.1.43:3150:8080"]
    volumes:
      - ./binternet-gateway.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    networks:
      binternet: {ipv4_address: 172.29.85.20}
    depends_on: [binternet]
networks:
  binternet:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.85.0/24}]}
