worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=book_api:2m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=book_images:2m rate=8r/s;
  limit_conn_zone $binary_remote_addr zone=book_connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  server {
    listen 8080;
    client_max_body_size 12k;
    client_body_buffer_size 12k;
    client_body_timeout 10s;
    limit_conn book_connections 24;
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; worker-src 'self' blob:; object-src 'none'" always;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location ~ ^/api/(deprecated/|search/books-old) { return 404; }
    location = /_next/image { return 404; }
    location ~ ^/(img|api/image)$ {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      limit_req zone=book_images burst=40 nodelay;
      proxy_pass http://172.29.88.10:3000;
      proxy_set_header Host biblioreads.utilibre.org;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_hide_header Set-Cookie;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 30s;
    }
    location /api/ {
      limit_req zone=book_api burst=15 nodelay;
      proxy_pass http://172.29.88.10:3000;
      proxy_set_header Host biblioreads.utilibre.org;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_hide_header Set-Cookie;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 30s;
    }
    location / {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://172.29.88.10:3000;
      proxy_set_header Host biblioreads.utilibre.org;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_hide_header Set-Cookie;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 30s;
    }
  }
}
