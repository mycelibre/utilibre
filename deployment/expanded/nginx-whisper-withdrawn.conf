worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    add_header Cache-Control "no-store, no-transform" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    location = /healthz { return 200 "withdrawal notice ready\n"; }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location / {
      default_type "text/plain; charset=utf-8";
      return 410 "This service is unavailable. More tools: https://utilibre.org/en/\n\nEste servicio no está disponible. Encontrá más herramientas en https://utilibre.org/es/\n\nHistorical source / Código histórico: https://tools.utilibre.org/utilibre-source/\n";
    }
  }
}
