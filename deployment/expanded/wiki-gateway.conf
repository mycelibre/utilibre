worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Real-IP;
  limit_req_zone $binary_remote_addr zone=wiki:1m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  limit_req_status 429;
  proxy_cache_path /tmp/cache levels=1:2 keys_zone=wiki_cache:8m max_size=64m inactive=10m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location / {
      limit_req zone=wiki burst=20 nodelay;
      limit_conn connections 6;
      set $wiki_backend http://breezewiki:10416;
      proxy_pass $wiki_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Cookie "";
      proxy_hide_header Set-Cookie;
      proxy_cache wiki_cache;
      proxy_cache_valid 200 5m;
      proxy_cache_lock on;
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
      proxy_max_temp_file_size 16m;
    }
  }
}
