name: utilibre-expanded

x-runtime: &runtime
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  cpus: 1
  pids_limit: 128
  # Retain service health, not request histories from native applications.
  logging: {driver: none}

# Account creation is gated by the invitation-only Utilibre identity provider.
# Wakapi has a provisioned owner and tested backup; public signups stay closed.
# Port 3109 belongs exclusively to IT Tools, not Wakapi.
services:
  jupyterlite:
    <<: *runtime
    image: utilibre-jupyterlite:0.8.5-p5
    read_only: true
    user: "101:101"
    volumes:
      - ../toolbox/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./security-jupyter.conf:/etc/nginx/tool-security.conf:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
    ports: ["10.10.1.43:3133:8080"]
    networks: [static]
    mem_limit: 192m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/lab/index.html]
      interval: 30s
      timeout: 5s
      retries: 3

  whisper:
    <<: *runtime
    image: utilibre-whisper:81869ed-p3
    read_only: true
    user: "101:101"
    volumes:
      - ../toolbox/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./security-whisper.conf:/etc/nginx/tool-security.conf:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
    ports: ["10.10.1.43:3137:8080"]
    networks: [static]
    mem_limit: 192m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 3

  breezewiki:
    <<: *runtime
    image: utilibre-breezewiki:6d09507-p2
    read_only: true
    user: "1000:1000"
    environment:
      bw_bind_host: 0.0.0.0
      bw_canonical_origin: https://wiki.utilibre.org
      bw_application_name: BreezeWiki
      bw_debug: "false"
      bw_feature_search_suggestions: "false"
      bw_feature_jsonp::enabled: "false"
      bw_log_outgoing: "false"
      bw_strict_proxy: "true"
      XDG_CACHE_HOME: /tmp/cache
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
      - /app/storage:rw,nosuid,nodev,noexec,size=32m,uid=1000,gid=1000
    networks:
      wiki: {ipv4_address: 172.29.71.10}
    mem_limit: 768m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10416/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3

  wiki-gateway:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    read_only: true
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./wiki-gateway.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777"]
    ports: ["10.10.1.43:3134:8080"]
    networks: [wiki]
    depends_on: [breezewiki]
    mem_limit: 192m

  wakapi:
    <<: *runtime
    image: utilibre-wakapi:2.18.1-p1
    read_only: true
    user: "65532:65532"
    environment:
      ENVIRONMENT: prod
      WAKAPI_PASSWORD_SALT: ${WAKAPI_PASSWORD_SALT:?Run init-private.mjs}
      WAKAPI_PUBLIC_URL: https://wakapi.utilibre.org
      WAKAPI_ALLOW_SIGNUP: "false"
      WAKAPI_DISABLE_LOCAL_AUTH: "true"
      WAKAPI_SUBSCRIPTIONS_ENABLED: "false"
      WAKAPI_OIDC_ALLOW_SIGNUP: "true"
      WAKAPI_OIDC_PROVIDERS_0_NAME: utilibre
      WAKAPI_OIDC_PROVIDERS_0_DISPLAY_NAME: Utilibre
      WAKAPI_OIDC_PROVIDERS_0_CLIENT_ID: ${WAKAPI_OIDC_CLIENT_ID:?Configure identity clients}
      WAKAPI_OIDC_PROVIDERS_0_CLIENT_SECRET: ${WAKAPI_OIDC_CLIENT_SECRET:?Configure identity clients}
      WAKAPI_OIDC_PROVIDERS_0_ENDPOINT: https://auth.utilibre.org/application/o/wakapi/
      WAKAPI_INVITE_CODES: "false"
      WAKAPI_INSECURE_COOKIES: "false"
      WAKAPI_MAIL_ENABLED: "false"
      WAKAPI_SUPPORT_CONTACT: ""
      WAKAPI_IMPORT_ENABLED: "false"
      WAKAPI_LEADERBOARD_ENABLED: "false"
      WAKAPI_DATA_RETENTION_MONTHS: "3"
      WAKAPI_MAX_INACTIVE_MONTHS: "-1"
      WAKAPI_EXPOSE_METRICS: "false"
      WAKAPI_SENTRY_DSN: ""
    volumes:
      - /opt/utilibre/expanded-data/wakapi:/data
      - ./.env.wakapi-config.yml:/app/config.yml:ro
    ports: ["10.10.1.43:3136:3000"]
    networks: [wakapi]

  actual:
    <<: *runtime
    image: actualbudget/actual-server:26.10.0@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c
    read_only: true
    user: "1000:1000"
    environment:
      ACTUAL_PORT: "5006"
      # Owner is established by bootstrap-actual.mjs before this is enabled.
      # Authentik admits approved members only; subsequent users receive BASIC.
      ACTUAL_USER_CREATION_MODE: login
      ACTUAL_LOGIN_METHOD: openid
      ACTUAL_ALLOWED_LOGIN_METHODS: openid
      ACTUAL_OPENID_ENFORCE: "true"
      ACTUAL_OPENID_DISCOVERY_URL: https://auth.utilibre.org/application/o/actual/
      ACTUAL_OPENID_CLIENT_ID: ${ACTUAL_OIDC_CLIENT_ID:?Configure identity clients}
      ACTUAL_OPENID_CLIENT_SECRET: ${ACTUAL_OIDC_CLIENT_SECRET:?Configure identity clients}
      ACTUAL_OPENID_SERVER_HOSTNAME: https://budget.utilibre.org
      ACTUAL_TOKEN_EXPIRATION: "86400"
    volumes: ["/opt/utilibre/expanded-data/actual:/data"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
    ports: ["10.10.1.43:3132:5006"]
    networks: [actual]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5006/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  resume:
    <<: *runtime
    image: ghcr.io/reactive-resume/reactive-resume:v6.0.0@sha256:29f418bd46d23f1d7cd9a73ec7f6bc46681926cb1ff617ac388064f45ee790d0
    read_only: true
    user: "1000:1000"
    environment:
      NODE_ENV: production
      APP_URL: https://cv.utilibre.org
      DATABASE_URL: postgresql://resume:${RESUME_DB_PASSWORD:?Run init-private.mjs}@resume-db:5432/resume
      AUTH_SECRET: ${RESUME_AUTH_SECRET:?Run init-private.mjs}
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/data
      # Only OIDC can create users; Authentik enforces approved membership.
      FLAG_DISABLE_SIGNUPS: "false"
      FLAG_DISABLE_EMAIL_AUTH: "true"
      OAUTH_PROVIDER_NAME: Utilibre
      OAUTH_CLIENT_ID: ${RESUME_OIDC_CLIENT_ID:?Configure identity clients}
      OAUTH_CLIENT_SECRET: ${RESUME_OIDC_CLIENT_SECRET:?Configure identity clients}
      OAUTH_DISCOVERY_URL: https://auth.utilibre.org/application/o/resume/.well-known/openid-configuration
      FLAG_DISABLE_API_RATE_LIMIT: "false"
      FLAG_ALLOW_UNSAFE_OAUTH_REDIRECT_URI: "false"
      FLAG_ALLOW_UNSAFE_AI_BASE_URL: "false"
      # Saved relay settings; this release also requires SMTP authentication.
      # Do not invent credentials or enable recovery until that is resolved.
      SMTP_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_PORT: ${SMTP_RELAY_PORT:-26}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: "false"
    volumes: ["/opt/utilibre/expanded-data/resume:/app/data"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"]
    ports: ["10.10.1.43:3130:3000"]
    networks: [resume-front, resume-data]
    depends_on:
      resume-db: {condition: service_healthy}
    mem_limit: 768m

  resume-db:
    <<: *runtime
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    read_only: true
    user: "70:70"
    environment:
      POSTGRES_USER: resume
      POSTGRES_DB: resume
      POSTGRES_PASSWORD: ${RESUME_DB_PASSWORD:?Run init-private.mjs}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes: ["/opt/utilibre/expanded-data/resume-db:/var/lib/postgresql/data"]
    tmpfs: ["/var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,uid=70,gid=70", "/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
    networks: [resume-data]
    mem_limit: 256m
    healthcheck:
      test: [CMD, pg_isready, -U, resume]
      interval: 10s
      timeout: 5s
      retries: 5

  penpot-frontend:
    <<: *runtime
    image: penpotapp/frontend:2.18.2@sha256:3619f48cbdd0c9197ad23bd3db1c9b4391d7c9c3137e22e806cd7f9c945c1c8e
    user: "1001:1001"
    environment:
      PENPOT_PUBLIC_URI: https://design.utilibre.org
      PENPOT_OIDC_NAME: Utilibre
      PENPOT_FLAGS: &penpot-flags disable-registration enable-oidc-registration enable-login-with-oidc disable-login-with-password disable-onboarding disable-telemetry enable-smtp disable-log-emails disable-log-invitation-tokens disable-prepl-server disable-mcp enable-admin-console enable-email-verification enable-secure-session-cookies disable-google-fonts-provider disable-dashboard-templates-section
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "52428800"
    volumes:
      - /opt/utilibre/expanded-data/penpot-assets:/opt/data/assets:ro
      - ../toolbox/language.html:/var/www/app/utilibre-language.html:ro
      - ../toolbox/language.js:/var/www/app/utilibre-language.js:ro
    ports: ["10.10.1.43:3131:8080"]
    networks: [penpot]
    depends_on: [penpot-backend, penpot-exporter, penpot-admin-console]
    mem_limit: 256m

  penpot-backend:
    <<: *runtime
    image: penpotapp/backend:2.18.2@sha256:5f362bda5b8df6684a5710c4c273f7c8aadb759ba6ebcd0cde18a348ad9b9828
    user: "1001:1001"
    environment:
      PENPOT_PUBLIC_URI: https://design.utilibre.org
      PENPOT_FLAGS: *penpot-flags
      PENPOT_ADMINS: admin@utilibre.org
      # Conservative pilot limits; approval remains individual at the identity provider.
      PENPOT_QUOTES_TEAMS_PER_PROFILE: "3"
      PENPOT_QUOTES_PROFILES_PER_TEAM: "10"
      PENPOT_QUOTES_FILES_PER_TEAM: "100"
      PENPOT_QUOTES_MEDIA_STORAGE_BYTES_PER_TEAM: "1073741824"
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Run init-private.mjs}
      PENPOT_DATABASE_URI: postgresql://penpot-db/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DB_PASSWORD:?Run init-private.mjs}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_OIDC_BASE_URI: https://auth.utilibre.org/application/o/penpot/
      PENPOT_OIDC_CLIENT_ID: ${PENPOT_OIDC_CLIENT_ID:?Configure identity clients}
      PENPOT_OIDC_CLIENT_SECRET: ${PENPOT_OIDC_CLIENT_SECRET:?Configure identity clients}
      PENPOT_SMTP_HOST: mx.mailgt.dev
      PENPOT_SMTP_PORT: ${SMTP_RELAY_PORT:-26}
      PENPOT_SMTP_TLS: "true"
      PENPOT_SMTP_DEFAULT_FROM: ${SMTP_FROM:-}
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${OPERATOR_EMAIL:-}
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "52428800"
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1024m -XX:ActiveProcessorCount=2
    volumes: ["/opt/utilibre/expanded-data/penpot-assets:/opt/data/assets"]
    extra_hosts: ["mx.mailgt.dev:10.10.1.20"]
    networks: [penpot, penpot-data]
    depends_on:
      penpot-db: {condition: service_healthy}
      penpot-valkey: {condition: service_healthy}
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256

  penpot-admin-console:
    <<: *runtime
    image: penpotapp/admin-console:2.18.2@sha256:5935b5adbf33eb7abaabfab657fe8f5d465cac08e62e340f932ddb35ce0f311f
    environment:
      PENPOT_PUBLIC_URI: https://design.utilibre.org
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Run init-private.mjs}
      PENPOT_DATABASE_URI: postgresql://penpot-db/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DB_PASSWORD:?Run init-private.mjs}
    networks: [penpot, penpot-data]
    depends_on:
      penpot-db: {condition: service_healthy}

  penpot-exporter:
    <<: *runtime
    image: penpotapp/exporter:2.18.2@sha256:4329b95d4b334b6ff95e80642fa634872a3111d6264f20e6262e43db4129ee58
    environment:
      PENPOT_PUBLIC_URI: https://design.utilibre.org
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Run init-private.mjs}
    networks: [penpot, penpot-data]
    depends_on:
      penpot-valkey: {condition: service_healthy}
    mem_limit: 768m
    pids_limit: 256
    shm_size: 128m

  penpot-db:
    <<: *runtime
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    read_only: true
    user: "70:70"
    environment:
      POSTGRES_USER: penpot
      POSTGRES_DB: penpot
      POSTGRES_PASSWORD: ${PENPOT_DB_PASSWORD:?Run init-private.mjs}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes: ["/opt/utilibre/expanded-data/penpot-db:/var/lib/postgresql/data"]
    tmpfs: ["/var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,uid=70,gid=70", "/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
    networks: [penpot-data]
    mem_limit: 256m
    healthcheck:
      test: [CMD, pg_isready, -U, penpot]
      interval: 10s
      timeout: 5s
      retries: 5

  penpot-valkey:
    <<: *runtime
    image: valkey/valkey:9.1.1-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    read_only: true
    user: "999:1000"
    command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, noeviction, --loglevel, warning]
    tmpfs: ["/data:rw,nosuid,nodev,noexec,size=8m,uid=999,gid=1000"]
    networks: [penpot-data]
    mem_limit: 192m
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  static: {}
  wiki:
    ipam: {config: [{subnet: 172.29.71.0/24}]}
  wakapi: {}
  actual: {}
  resume-front: {}
  resume-data: {internal: true}
  penpot: {}
  penpot-data: {internal: true}
