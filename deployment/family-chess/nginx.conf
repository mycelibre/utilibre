worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $uri $cache_control {
    default "no-store, no-transform";
    ~^/static/ "public, max-age=604800, no-transform";
  }
  limit_req_zone $binary_remote_addr zone=create:1m rate=2r/m;
  limit_req_zone $server_name zone=total_create:1m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=requests:1m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  # Trust the existing edge's sanitized client address, not arbitrary headers.
  set_real_ip_from 10.10.1.3;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  server {
    listen 8080;
    server_name chess.utilibre.org;
    client_max_body_size 16k;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn connections 16;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=()' always;
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow:\n"; }
    location /admin/ { return 404; }
    location /static/ { alias /srv/static/; }
    location / {
      limit_req zone=requests burst=20 nodelay;
      proxy_pass http://172.29.142.10:8000;
      include /etc/nginx/proxy_params;
    }
    location = /new/ {
      limit_req zone=create burst=2 nodelay;
      limit_req zone=total_create burst=3 nodelay;
      proxy_pass http://172.29.142.10:8000;
      include /etc/nginx/proxy_params;
    }
  }
}
