name: utilibre-freetar
services:
  freetar:
    image: utilibre-freetar:0.22.0-p1-20261124
    restart: unless-stopped
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 64
    logging: {driver: none}
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777']
    environment:
      FREETAR_LOCAL: '1'
      FREETAR_CACHING: ram
      FREETAR_CACHE_TIMEOUT: '900'
      FREETAR_CACHE_THRESHOLD: '128'
      FREETAR_PORT: '22000'
    volumes:
      - /opt/utilibre/toolbox-public:/source:ro
    ports:
      - target: 22000
        published: '3243'
        host_ip: '${PRIVATE_BIND_IP:?Set exact private bind address}'
        protocol: tcp
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:22000/healthz', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
