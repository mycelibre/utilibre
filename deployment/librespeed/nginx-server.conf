# Included by the existing OmniTools static server's http block. No new proxy.
# Global concurrency, NOT visitor/IP identifiers; RAM only.
limit_conn_zone $server_name zone=speed_connections:32k;
map $http_origin $speed_bad_origin {
  default 1;
  "" 0;
  "https://speed.utilibre.org" 0;
  "http://127.0.0.1:3225" 0;
  "http://10.10.1.43:3225" 0;
}
server {
  listen 8086;
  server_name speed.utilibre.org;
  root /srv/utilibre-source/apps/librespeed;
  index index.html;
  allow 10.10.1.3;
  allow 10.10.1.43;
  allow 172.23.0.1;
  allow 127.0.0.1;
  deny all;
  access_log off;
  error_log /dev/null crit;
  gzip off;
  proxy_buffering off;
  client_max_body_size 21m;
  client_body_timeout 15s;
  send_timeout 15s;
  if ($speed_bad_origin) { return 403; }
  if ($http_sec_fetch_site = cross-site) { return 403; }
  add_header Cache-Control "no-store, no-transform" always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
  location = /healthz {
    limit_except GET { deny all; }
    proxy_pass_request_body off;
    set $args "";
    proxy_pass http://172.29.156.10:8989/empty;
    include /etc/nginx/librespeed-proxy.conf;
  }
  location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
  location = /backend/garbage.php {
    limit_except GET { deny all; }
    proxy_pass_request_body off;
    limit_conn speed_connections 6;
    limit_conn_status 429;
    # Stream without rate shaping or buffering: either distorts throughput.
    set $args ckSize=32;
    proxy_pass http://172.29.156.10:8989/garbage;
    include /etc/nginx/librespeed-proxy.conf;
  }
  location = /backend/empty.php {
    limit_except GET POST { deny all; }
    limit_conn speed_connections 6;
    limit_conn_status 429;
    set $args "";
    proxy_pass http://172.29.156.10:8989/empty;
    include /etc/nginx/librespeed-proxy.conf;
  }
  location / {
    limit_except GET { deny all; }
    try_files $uri $uri/ =404;
    autoindex off;
  }
}
