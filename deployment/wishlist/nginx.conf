worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $request_method $write_key { default $binary_remote_addr; GET ''; HEAD ''; OPTIONS ''; }
  limit_req_zone $write_key zone=writes:1m rate=30r/m;
  limit_req_status 429;
  map $uri $cache_control { default 'private, no-store'; ~^/_app/immutable/ 'public, max-age=31536000, immutable'; ~^/vendor/ 'public, max-age=86400'; }
  server {
    listen 8080;
    server_name wishlist.utilibre.org;
    client_max_body_size 1100k;
    limit_req zone=writes burst=30 nodelay;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://auth.utilibre.org" always;
    location = /robots.txt { default_type text/plain; return 200 'User-agent: *\nAllow: /\n'; }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    # Native manual entry remains usable; no third-party product/image fetch.
    location = /api/product { return 404; }
    location / {
      resolver 127.0.0.11 ipv6=off valid=10s;
      set $upstream http://app:3280;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host wishlist.utilibre.org;
      proxy_set_header X-Forwarded-Host wishlist.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection '';
      proxy_hide_header Cache-Control;
      proxy_hide_header Content-Security-Policy;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_max_temp_file_size 0;
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
      proxy_read_timeout 90s;
    }
  }
}
