name: utilibre-wishlist
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging:
    driver: json-file
    options: {max-size: 1m, max-file: '2'}
services:
  app:
    <<: *runtime
    image: utilibre-wishlist:0.67.1-p2
    build: /opt/utilibre/community-src/wishlist-utilibre-0.67.1-p1
    user: '1000:1000'
    mem_limit: 512m
    cpus: 1
    environment:
      ORIGIN: https://wishlist.utilibre.org
      TOKEN_TIME: '72'
      DEFAULT_CURRENCY: USD
      MAX_IMAGE_SIZE: '1048576'
      LOG_LEVEL: warn
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      CHECKPOINT_DISABLE: '1'
      NODE_OPTIONS: --max-old-space-size=384
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    extra_hosts: ['auth.utilibre.org:10.10.1.3']
    volumes:
      - /opt/utilibre/wishlist/data:/usr/src/app/data
      - /opt/utilibre/wishlist/uploads:/usr/src/app/uploads
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777']
    networks:
      app: {ipv4_address: 172.29.130.10}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3280/login',{redirect:'manual'}).then(r=>process.exit(r.status===200||r.status===302?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  gateway:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    mem_limit: 96m
    cpus: 0.5
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777']
    # Native operator bootstrap completed and public signup is closed.
    ports: ['10.10.1.43:3193:8080', '127.0.0.1:3193:8080']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on: [app]
    networks:
      app: {ipv4_address: 172.29.130.20}
networks:
  app:
    ipam: {config: [{subnet: 172.29.130.0/24}]}
