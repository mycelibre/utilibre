# BentoPDF and OmniTools download processing engines/language data, not input
# documents, from these CDNs. Keep this exception out of the other tools.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://rawcdn.githack.com https://raw.githack.com; connect-src 'self' blob: https://cdn.jsdelivr.net https://unpkg.com https://rawcdn.githack.com https://raw.githack.com; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
