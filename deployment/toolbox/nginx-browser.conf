worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  keepalive_timeout 15;
  client_max_body_size 1k;
  map $uri $source_robots { default ""; ~^/utilibre-source/ "noindex, nofollow"; }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    # Private edge and app-VM diagnostics only; no trusted forwarded-IP rewrite.
    allow 10.10.1.3;
    allow 10.10.1.43;
    allow 127.0.0.1;
    deny all;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag $source_robots always;
    include /etc/nginx/tool-security.conf;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex off; }
    location ~ (^|/)\. { return 404; }
    location ~* \.(py|go|map)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
  }
}
