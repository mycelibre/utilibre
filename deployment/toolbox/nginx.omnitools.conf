# These containers have 0.5-1 CPU quotas; host CPU count overstates their budget.
worker_processes 1;
worker_rlimit_nofile 8192;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  keepalive_timeout 15;
  client_max_body_size 64k;
  server {
    # Discover the verified, canonical Utilibre security contact.
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    include /etc/nginx/tool-security.conf;
    location = /utilibre-language.html { alias /srv/utilibre-source/language.html; }
    location = /utilibre-language.js { alias /srv/utilibre-source/language.js; }
    location /utilibre-source/ {
      alias /srv/utilibre-source/;
      autoindex off;
    }
    # Reviewed browser applications share the existing static assets mount.
    # Their builds use an explicit /apps/<name>/ base and local-only assets.
# Include only inside the OmniTools server block. Attach only that gateway to
# utilibre-rustpad_private; the app has no published port or outbound network.
location = /apps/rustpad { return 308 /apps/rustpad/; }
location ^~ /apps/rustpad/ {
    proxy_pass http://172.29.141.10:3030/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 30s;
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://tools.utilibre.org; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header Cache-Control "no-cache, no-transform" always;
}

# Keep shared-text/API responses out of HTTP caches; static editor assets above
# retain normal conditional revalidation instead of disabling useful caching.
location ^~ /apps/rustpad/api/ {
    proxy_pass http://172.29.141.10:3030/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 30s;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
}

    # AutoRedact's PDF/ZIP operations fetch canvas data URLs locally.
    location ^~ /apps/autoredact/ {
      alias /srv/utilibre-source/apps/autoredact/;
      index index.html;
      autoindex off;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control "no-cache, no-transform" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header X-Frame-Options DENY always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Embedder-Policy credentialless always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      include /etc/nginx/security-autoredact.conf;
    }
    # Kokoro uses local model inference and Blob audio playback.
    location ^~ /apps/kokoro-web/ {
      alias /srv/utilibre-source/apps/kokoro-web/;
      index index.html;
      autoindex off;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control "no-cache, no-transform" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header X-Frame-Options DENY always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Embedder-Policy credentialless always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      include /etc/nginx/security-kokoro-web.conf;
    }
    location /apps/ {
      alias /srv/utilibre-source/apps/;
      index index.html;
      autoindex off;
    }
    location ~ ^/(WEB-INF|META-INF|\.git)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ $uri.html /index.html; }
  }
}
