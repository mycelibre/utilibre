worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  keepalive_timeout 15;
  client_max_body_size 64k;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    include /etc/nginx/tool-security.conf;
    location = /utilibre-language.html { alias /srv/utilibre-source/language.html; }
    location = /utilibre-language.js { alias /srv/utilibre-source/language.js; }
    location /utilibre-source/ {
      alias /srv/utilibre-source/;
      autoindex off;
    }
    location ~ ^/(WEB-INF|META-INF|\.git)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ $uri.html /index.html; }
  }
}
