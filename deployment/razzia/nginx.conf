worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=quiz:1m rate=15r/s;
  limit_conn_zone $binary_remote_addr zone=quiz_conn:1m;
  set_real_ip_from 10.10.1.0/24;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    absolute_redirect off;
    root /srv/razzia;
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req zone=quiz burst=60 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag noindex always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /healthz { return 200 "ok\n"; }
    # Permit crawling of already-public responses so noindex can be observed.
    # Authentication and DAV/manager permissions still govern private content.
    location = /robots.txt {
      default_type text/plain;
      charset utf-8;
      return 200 "User-agent: *\nDisallow:\n";
    }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location /branding/ { alias /srv/branding/; }
    location /ws {
      limit_conn quiz_conn 40;
      proxy_pass http://socket:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 60s;
      proxy_buffering off;
    }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
  }
}
