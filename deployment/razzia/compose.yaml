name: utilibre-razzia
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 96
  mem_limit: 256m
  cpus: 1
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  socket:
    <<: *runtime
    image: utilibre-razzia:3.1.0-p1
    volumes: ["/opt/utilibre/razzia-data:/app/config"]
    networks: [quiz]
    # Native connection messages contain client identifiers; do not retain them.
    logging: {driver: none}
  gateway:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    cpus: 0.5
    mem_limit: 128m
    ports: ["10.10.1.43:3199:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/razzia-static:/srv/razzia:ro
      - /opt/utilibre/razzia-data/branding:/srv/branding:ro
    networks: [quiz, ingress]
    depends_on: [socket]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  quiz:
    internal: true
    ipam: {config: [{subnet: 172.29.114.0/24}]}
  ingress:
    ipam: {config: [{subnet: 172.29.115.0/24}]}
