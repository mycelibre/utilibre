name: utilibre-pack-forms
services:
  db:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: '70:70'
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: none}
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    env_file: /opt/utilibre/pack-secrets/liberaforms.env
    environment: {POSTGRES_USER: forms, POSTGRES_DB: forms, POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=trust'}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=20, -c, max_wal_size=256MB, -c, log_statement=none, -c, log_connections=off, -c, log_disconnections=off, -c, log_min_error_statement=panic]
    volumes: ['/opt/utilibre/pack-data/liberaforms/db:/var/lib/postgresql/data']
    networks: {forms: {ipv4_address: 172.29.98.2}}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U forms -d forms']
      interval: 10s
      timeout: 3s
      retries: 5
  app:
    image: utilibre-liberaforms:4.11.1-p5
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    user: '4002:4002'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: none}
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 64
    env_file: /opt/utilibre/pack-secrets/liberaforms.env
    environment:
      FLASK_CONFIG: production
      FLASK_DEBUG: 'False'
      BASE_URL: https://forms.utilibre.org
      ROOT_USER: admin@utilibre.org
      DEFAULT_LANGUAGE: es-ES
      DEFAULT_TIMEZONE: America/Guatemala
      DB_HOST: db
      DB_NAME: forms
      DB_USER: forms
      SESSION_TYPE: sqlalchemy
      TOKEN_EXPIRATION: '86400'
      TMP_DIR: /tmp
      LOG_DIR: /tmp/logs
      LOG_LEVEL: CRITICAL
      E2EE_MODE: REQUIRED
      ENABLE_UPLOADS: 'False'
      ENABLE_REMOTE_STORAGE: 'False'
      ENABLE_CONFIRMATION_EMAIL: 'False'
      ENABLE_RSS_FEED: 'False'
      ENABLE_LDAP: 'False'
      ENABLE_PROMETHEUS_METRICS: 'False'
      TOTAL_UPLOADS_LIMIT: 0 MB
      DEFAULT_USER_UPLOADS_LIMIT: 0 MB
      MAX_MEDIA_SIZE: '262144'
      MAX_ATTACHMENT_SIZE: '0'
      FORMS_MAX_DURATION: '180'
      FORMS_DEFAULT_DURATION: '90'
      PURGE_EXPIRED_FORMS_AFTER_X_DAYS: '30'
      SECONDS_TO_POST: '0'
      RATELIMIT_STORAGE_URI: memory://
      RATELIMIT_PER_MINUTE: '30'
      RATELIMIT_PER_SECOND: '2'
    extra_hosts: ['mx.mailgt.dev:10.10.1.20']
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777']
    volumes:
      - /opt/utilibre/pack-data/liberaforms/uploads:/app/uploads
      - ./liberaforms-logging.py:/app/liberaforms/config/logging.py:ro
    networks: {forms: {ipv4_address: 172.29.98.3}}
  web:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    entrypoint: [nginx, -g, 'daemon off;']
    restart: unless-stopped
    depends_on: [app]
    user: '101:101'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: none}
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777']
    volumes:
      - ./nginx-forms.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/pack-data/liberaforms/uploads/media/brand:/srv/brand:ro
      - /opt/utilibre/toolbox-public:/srv/utilibre-source:ro
    ports: ['10.10.1.43:3176:8080']
    networks: {forms: {ipv4_address: 172.29.98.4}}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/logo.png]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  forms:
    ipam: {config: [{subnet: 172.29.98.0/24}]}
