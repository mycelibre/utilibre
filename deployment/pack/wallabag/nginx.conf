worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 2m;
    # Aggregate service limit; no visitor identifier is stored by this limiter.
    limit_req_zone $server_name zone=fetch_budget:32k rate=6r/m;
    map $request_method $auth_bucket { default ""; POST wallabag-auth; }
    limit_req_zone $auth_bucket zone=auth_budget:32k rate=30r/m;
    limit_req_status 429;
    map $http_x_forwarded_proto $fastcgi_https { default off; https on; }
    server {
        listen 8080;
        server_name wallabag.utilibre.org;
        root /srv/wallabag;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        # Native translated deletion confirmations need inline event handlers.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'none'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        location ~ ^/(?:assets/images|share|feed|register|api|oauth|_profiler|_wdt|settings)(?:/|$) { return 404; }
        location ~ \.xml$ { return 404; }
        location ~ ^/(?:login_check|2fa_check|2fa|resetting/send-email)(?:/|$) {
            limit_req zone=auth_budget burst=5 nodelay;
            try_files /__not_a_public_file__ @application;
        }
        location ~ (^|/)\. { return 404; }
        location ~ ^/(?:new-entry|bookmarklet|reload|import)(?:/|$) {
            limit_req zone=fetch_budget burst=2 nodelay;
            try_files /__not_a_public_file__ @application;
        }
        location = / { try_files /__not_a_public_file__ @application; }
        location / { try_files $uri @application; }
        location ~ \.php(?:/|$) { return 404; }
        location @application {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/web/index.php;
            # HTTPS is supplied by the existing edge in production. The private
            # rehearsal retains HTTP until public routing is configured.
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_param HTTP_X_FORWARDED_FOR "";
            fastcgi_param HTTP_X_REAL_IP "";
            fastcgi_param HTTP_FORWARDED "";
            fastcgi_pass 172.29.155.2:8080;
            fastcgi_read_timeout 28s;
            fastcgi_buffering off;
            fastcgi_request_buffering off;
        }
    }
}
