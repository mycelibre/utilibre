# Intersects the upstream CSP; never relax its script/nonce policy.
Header always set Content-Security-Policy "img-src 'self' data: blob:; media-src 'none'; frame-src 'none'; object-src 'none'; connect-src 'self'; base-uri 'self'; form-action 'self'"
Header always set Referrer-Policy "no-referrer"
Header always set X-Robots-Tag "noindex, nofollow"
Header always merge Cache-Control "no-transform"
ErrorLog /dev/null
