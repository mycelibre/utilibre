# LiberaForms 4.11.1 docs/nginx.example: branding is served by the web server,
# not Flask. Expose only these public brand files, never the uploads directory.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  keepalive_timeout 15;
  client_max_body_size 2m;
  # Only the existing edge may supply the address used by the transient limiter.
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  server {
    listen 8080;
    # Flask-WTF's HTTPS CSRF check requires a same-origin Referer on POST.
    # Never send one to other origins; do not disable the native CSRF check.
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store, no-transform" always;
    # Native inline scripts/styles and Vue templates; no third-party resources.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    location = /logo.png { alias /srv/brand/logo.png; }
    location = /favicon.ico { alias /srv/brand/favicon.ico; }
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex on; }
    # Optional adoption/activity analytics are not part of this service.
    location ~ ^/(?:user/statistics|site/stats|server/logs)(?:/|$) { return 404; }
    location ~ ^/(?:moderate/user/[0-9]+/stats|form/[0-9]+/log)(?:/|$) { return 404; }
    location / {
      proxy_pass http://172.29.98.3:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 35s;
      # Responses and submitted forms are not written to a proxy cache or disk.
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
