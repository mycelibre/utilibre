worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  keepalive_timeout 15;
  client_max_body_size 1k;
  server {
    listen 8080;
    root /srv/maps;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex on; }
    include /etc/nginx/static-security.conf;
    # The expression/attribute console uses upstream JavaScript expressions.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ =404; }
  }
  server {
    listen 8082;
    root /srv/plan;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex on; }
    include /etc/nginx/static-security.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; frame-src 'self' blob:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ /index.html; }
  }
  server {
    listen 8081;
    root /srv/calc;
    location /utilibre-source/ { alias /srv/utilibre-source/; autoindex on; }
    include /etc/nginx/static-security.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ =404; }
  }
}
