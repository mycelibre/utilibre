pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=chitchatter_requests:1m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=chitchatter_connections:1m;
  set_real_ip_from 10.10.1.0/24;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    root /srv/app;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://chat.utilibre.org ws://localhost:3200 blob:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { return 200 'ok'; }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /tracker {
      limit_req zone=chitchatter_requests burst=20 nodelay;
      limit_conn chitchatter_connections 24;
      proxy_pass http://tracker:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For "";
      proxy_read_timeout 180s;
      proxy_send_timeout 30s;
      proxy_buffering off;
    }
    location / { limit_except GET HEAD { deny all; } try_files $uri $uri/ /index.html; }
  }
}
