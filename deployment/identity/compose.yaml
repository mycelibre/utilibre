name: utilibre-identity

x-runtime: &runtime
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-authentik: &authentik
  <<: *runtime
  image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
  user: "1000:1000"
  shm_size: 512m
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"]
  environment: &authentik-environment
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?Run init-private.mjs}
    # PostgreSQL is reachable only on this isolated Docker network.
    AUTHENTIK_POSTGRESQL__SSLMODE: disable
    AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Run init-private.mjs}
    AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: 10.10.1.3/32
    # This release requires a socket address; never publish this TLS listener.
    AUTHENTIK_LISTEN__HTTPS: 127.0.0.1:9443
    AUTHENTIK_WEB__WORKERS: "2"
    AUTHENTIK_WORKER__PROCESSES: "1"
    AUTHENTIK_WORKER__THREADS: "2"
    AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    AUTHENTIK_OUTPOSTS__DISABLE_EMBEDDED_OUTPOST: "true"
    AUTHENTIK_OUTPOSTS__DISCOVER: "false"
    # Operator-confirmed TLS name. Private routing is pinned below; no AUTH.
    AUTHENTIK_EMAIL__HOST: ${SMTP_RELAY_HOST:-mx.mailgt.dev}
    AUTHENTIK_EMAIL__PORT: "26"
    AUTHENTIK_EMAIL__USE_TLS: "true"
    AUTHENTIK_EMAIL__USE_SSL: "false"
    AUTHENTIK_EMAIL__TIMEOUT: "10"
    AUTHENTIK_EMAIL__FROM: no-reply@utilibre.org
  extra_hosts:
    - "mx.mailgt.dev:10.10.1.20"
  volumes:
    - /opt/utilibre/identity-data/data:/data
    - ./configure.py:/integration/configure.py:ro
    # Native email-template directory, shared by web and worker rendering.
    - ./email-templates:/templates:ro
  networks: [database, identity]
  depends_on:
    postgresql: {condition: service_healthy}
  mem_limit: 1536m
  cpus: 1.5

services:
  postgresql:
    <<: *runtime
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: "70:70"
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${PG_PASS:?Run init-private.mjs}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - /opt/utilibre/identity-data/postgresql:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,uid=70,gid=70
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: 1

  server:
    <<: *authentik
    command: server
    ports: ["10.10.1.43:3138:9000"]

  worker:
    <<: *authentik
    command: worker
    # Deliberately no Docker socket, host root privileges, or public ports.

networks:
  database: {internal: true}
  identity: {}
