# Utilibre does not operate a kernel SMB server. Mitigate CVE-2026-43185
# without replacing the stable kernel or touching the separate CIFS client.
# Reviewed 2026-10-11; remove only if an SMB server is deliberately provisioned
# after a fixed kernel is installed and verified. No module is forcibly unloaded.
blacklist ksmbd
# Defence in depth only: kmod softdeps can override an install command.
# Explicit administrative loading is not prevented on this installed kernel.
install ksmbd /bin/false
