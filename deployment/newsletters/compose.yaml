name: utilibre-newsletters
x-app: &app
  image: utilibre-newsletters:2.1.3-p1
  user: '1000:1000'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  cpus: 0.5
  mem_limit: 192m
  tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777']
  volumes:
    - /opt/utilibre/newsletters/data:/data
    - /opt/utilibre/newsletters/private:/private:ro
    - ./configuration.mjs:/configuration.mjs:ro
  dns: [127.0.0.1]
  networks: [data]
  logging:
    driver: json-file
    options: {max-size: 1m, max-file: '2'}
services:
  initialize:
    <<: *app
    networks:
      data: {ipv4_address: 172.29.132.40}
    restart: 'no'
    command: [sh, -c, 'node build/application.mjs /configuration.mjs --type initialize 3>/dev/null']
  web:
    <<: *app
    # Copy-only revision; SMTP and jobs retain the same native processing build.
    image: utilibre-newsletters:2.1.3-p2
    restart: unless-stopped
    networks:
      data: {ipv4_address: 172.29.132.10}
      ingress: {ipv4_address: 172.29.140.10}
    # firewall.sh adds edge-only 10.10.1.43:3210 DNAT without recreating web.
    ports: ['127.0.0.1:3210:8080']
    command: [node, build/application.mjs, /configuration.mjs, --type, webServer, --port, '18000']
    depends_on: {initialize: {condition: service_completed_successfully}}
  smtp:
    <<: *app
    restart: "no"
    networks:
      data: {ipv4_address: 172.29.132.20}
      ingress: {ipv4_address: 172.29.140.20}
    entrypoint: [sh, /smtp-entrypoint.sh]
    command: [node, build/application.mjs, /configuration.mjs, --type, emailServer]
    volumes:
      - /opt/utilibre/newsletters/data:/data
      - /opt/utilibre/newsletters/private:/private:ro
      - ./configuration.mjs:/configuration.mjs:ro
      - ./smtp-entrypoint.sh:/smtp-entrypoint.sh:ro
      - /run/utilibre-newsletters-smtp:/smtp-startup:ro
    ports: ['10.10.1.43:2526:25']
    depends_on: {initialize: {condition: service_completed_successfully}}
  jobs:
    <<: *app
    restart: unless-stopped
    networks:
      data: {ipv4_address: 172.29.132.30}
    command: [node, build/application.mjs, /configuration.mjs, --type, backgroundJobWorker]
    depends_on: {initialize: {condition: service_completed_successfully}}
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    restart: unless-stopped
    user: '101:101'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: 0.25
    mem_limit: 64m
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777']
    entrypoint: [nginx, -g, 'daemon off;']
    network_mode: service:web
    depends_on: [web]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/newsletters/assets:/assets:ro
      - /opt/utilibre/newsletters/data/files:/files:ro
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '2'}
networks:
  data:
    internal: true
    ipam: {config: [{subnet: 172.29.132.0/24}]}
  ingress:
    ipam: {config: [{subnet: 172.29.140.0/24}]}
