worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $uri $cache_control { default 'private, no-store'; ~^/assets/ 'public, max-age=3600'; ~^/api/v1/assets/ 'private, max-age=600'; }
  map $uri $csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://chores.utilibre.org; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://auth.utilibre.org";
    ~^/api/v1/assets/ "sandbox; default-src 'none'; img-src data:; style-src 'unsafe-inline'; frame-ancestors 'none'";
  }
  map $request_method $write_key { default $binary_remote_addr; GET ''; HEAD ''; OPTIONS ''; }
  limit_req_zone $write_key zone=writes:1m rate=120r/m;
  limit_req_status 429;
  server {
    listen 8080;
    server_name chores.utilibre.org;
    client_max_body_size 5500k;
    client_body_timeout 15s;
    limit_req zone=writes burst=30 nodelay;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy $csp always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    location = /robots.txt { default_type text/plain; return 200 'User-agent: *\nAllow: /\n'; }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    # Native in-app reminders remain; external notification integrations are unavailable.
    location ~ ^/api/v1/users/(webhook|targets)/?$ { return 404; }
    location / {
      proxy_pass http://172.29.143.10:2021;
      proxy_http_version 1.1;
      proxy_set_header Host chores.utilibre.org;
      proxy_set_header X-Forwarded-Host chores.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      proxy_hide_header Content-Security-Policy;
      proxy_buffering off;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 120s;
    }
  }
  # Fixed native OAuth transport only. Never exposed on the public listener.
  server {
    listen 9001;
    server_name _;
    allow 172.29.143.10;
    deny all;
    client_max_body_size 32k;
    location ~ ^/application/o/(token|userinfo)/$ {
      proxy_pass https://10.10.1.3;
      proxy_set_header Host auth.utilibre.org;
      proxy_ssl_server_name on;
      proxy_ssl_name auth.utilibre.org;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 4;
      proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
    }
    location / { return 404; }
  }
}
