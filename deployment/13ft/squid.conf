http_port 172.29.118.20:3128
visible_hostname utilibre-reader-egress
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache_effective_user nobody
cache_effective_group nogroup
access_log none
cache_log /dev/stderr
debug_options ALL,0
cache_store_log none
cache deny all
cache_mem 8 MB
maximum_object_size_in_memory 0 KB
forwarded_for delete
via off
# These DNS resolvers are already configured on the VM; only the proxy uses them.
dns_nameservers 1.1.1.1 9.9.9.9
dns_timeout 3 seconds
connect_timeout 3 seconds
request_timeout 5 seconds
read_timeout 5 seconds
client_lifetime 15 seconds
shutdown_lifetime 1 seconds
request_header_max_size 16 KB
reply_header_max_size 32 KB
reply_body_max_size 1100 KB all
acl reader src 172.29.118.10/32
acl safe_ports port 80 443
acl tls_ports port 443
acl ipv6_literal url_regex -i ^[a-z]+://\[ ^\[
acl CONNECT method CONNECT
acl read_methods method GET HEAD CONNECT
# Deny every nonpublic class, not merely RFC1918. IPv6 transport is disabled too.
acl forbidden dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3 ::/128 ::1/128 64:ff9b::/96 100::/64 2001:db8::/32 fc00::/7 fe80::/10 fec0::/10 ff00::/8
http_access deny !reader
http_access deny !read_methods
http_access deny !safe_ports
http_access deny CONNECT !tls_ports
http_access deny ipv6_literal
http_access deny forbidden
http_access allow reader
http_access deny all
request_header_access Cookie deny all
request_header_access Authorization deny all
request_header_access Proxy-Authorization deny all
request_header_access Forwarded deny all
request_header_access X-Forwarded-For deny all
