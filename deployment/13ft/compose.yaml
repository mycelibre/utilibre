name: utilibre-13ft
x-limits: &limits
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 48
  logging: {driver: json-file, options: {max-size: 1m, max-file: '2'}}
services:
  app:
    <<: *limits
    image: utilibre-13ft:certifi-20261021
    cpus: 1
    mem_limit: 256m
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777']
    dns: [127.0.0.1]
    sysctls: {net.ipv6.conf.all.disable_ipv6: '1'}
    networks: {isolated: {ipv4_address: 172.29.118.10}}
  proxy:
    <<: *limits
    image: utilibre-util-linux-13ft-proxy:security-20261012
    cpus: 0.5
    mem_limit: 192m
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777']
    volumes: ['./squid.conf:/etc/squid/squid.conf:ro']
    dns: [1.1.1.1, 9.9.9.9]
    sysctls: {net.ipv6.conf.all.disable_ipv6: '1'}
    networks: {isolated: {ipv4_address: 172.29.118.20}, egress: {ipv4_address: 172.29.119.20}}
  gateway:
    <<: *limits
    image: utilibre-nginx:1.30.6-curl823-brotli121-20261028
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    cpus: 0.25
    mem_limit: 64m
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1:3207:8080', '10.10.1.43:3207:8080']
    networks: {isolated: {ipv4_address: 172.29.118.30}, egress: {ipv4_address: 172.29.119.30}}
networks:
  isolated: {internal: true, enable_ipv6: false, ipam: {config: [{subnet: 172.29.118.0/24}]}}
  egress: {enable_ipv6: false, ipam: {config: [{subnet: 172.29.119.0/24}]}}
