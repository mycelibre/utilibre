pid /tmp/nginx.pid;
error_log /dev/stderr crit;
worker_processes 1;
events { worker_connections 64; }
http {
    access_log off;
    set_real_ip_from 10.10.1.3;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=per_client:1m rate=12r/m;
    limit_conn_zone $server_name zone=total:1m;
    server {
        listen 8080;
        server_name _;
        server_tokens off;
        client_max_body_size 4k;
        client_body_timeout 5s;
        send_timeout 5s;
        keepalive_timeout 5s;
        limit_req zone=per_client burst=4 nodelay;
        limit_req_status 429;
        limit_conn total 2;
        limit_conn_status 429;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag noindex always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "sandbox allow-forms allow-same-origin; default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        location = / {
            proxy_pass http://172.29.118.10:5000;
            proxy_read_timeout 14s;
        }
        location = /article {
            # No scripts, frames, forms or automatic source-resource requests.
            add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Robots-Tag noindex always;
            add_header Cache-Control no-store always;
            proxy_pass http://172.29.118.10:5000;
            proxy_connect_timeout 2s;
            proxy_read_timeout 14s;
            proxy_buffering off;
        }
        location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
        location = /robots.txt { default_type text/plain; return 200 'User-agent: *\nAllow: /\n'; }
        location / { return 404; }
    }
}
