name: utilibre-projects
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: {driver: json-file, options: {max-size: 1m, max-file: '2'}}
services:
  gateway:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    entrypoint: [nginx, -g, 'daemon off;']
    user: '101:101'
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['10.10.1.43:3217:8080', '127.0.0.1:3217:8080']
    depends_on: {app: {condition: service_healthy}}
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777']
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    networks:
      private: {ipv4_address: 172.29.148.20}
      ingress: {ipv4_address: 172.29.149.20}
  db:
    <<: *runtime
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: '70:70'
    env_file: /opt/utilibre/projects/private/database.env
    volumes: ['/opt/utilibre/projects/database:/var/lib/postgresql/data']
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777', '/var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,uid=70,gid=70']
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U projects -d projects']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      private: {ipv4_address: 172.29.148.30}
  app:
    <<: *runtime
    image: utilibre-projects:455aa274-p2
    user: '1000:1000'
    env_file: /opt/utilibre/projects/private/runtime.env
    extra_hosts: ['auth.utilibre.org:10.10.1.3']
    depends_on: {db: {condition: service_healthy}}
    volumes:
      - /opt/utilibre/projects/data/avatars:/app/public/user-avatars
      - /opt/utilibre/projects/data/backgrounds:/app/public/project-background-images
      - /opt/utilibre/projects/data/attachments:/app/attachments
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
      - /app/logs:rw,nosuid,nodev,noexec,size=16m,uid=1000,gid=1000,mode=0750
      - /app/.tmp:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000,mode=0750
    cpus: 1
    mem_limit: 512m
    pids_limit: 96
    healthcheck:
      test: [CMD, node, ./healthcheck.js]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      private: {ipv4_address: 172.29.148.10}
      ingress: {ipv4_address: 172.29.149.10}
networks:
  private: {internal: true, ipam: {config: [{subnet: 172.29.148.0/24}]}}
  ingress: {ipam: {config: [{subnet: 172.29.149.0/24}]}}
