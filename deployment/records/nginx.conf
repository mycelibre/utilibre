worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  client_max_body_size 26m;
  client_body_timeout 30s;
  allow 10.10.1.3;
  allow 10.10.1.43;
  allow 127.0.0.1;
  allow 172.29.158.1;
  allow 172.29.159.1;
  deny all;
  server {
    listen 8080;
    server_name grist.utilibre.org;
    include /etc/nginx/records-headers.conf;
    location = /healthz { proxy_pass http://172.29.158.10:8484/status; include /etc/nginx/records-proxy.conf; }
    location / { proxy_pass http://172.29.158.11:4180; include /etc/nginx/records-proxy.conf; }
  }
  server {
    listen 8081;
    server_name candlr.utilibre.org;
    client_max_body_size 11m;
    include /etc/nginx/records-headers.conf;
    location /utilibre-source/ { alias /srv/source/; }
    location = /api/auth/register { return 403; }
    location = /api/auth/login { return 403; }
    # Only native email reminders are enabled in this bounded installation.
    location ~ ^/api/notifications/channels/(?!email(?:/|$)) { return 403; }
    location /api/carddav { return 403; }
    location = /api/images/preview { return 403; }
    location / { proxy_pass http://172.29.158.12:4258; include /etc/nginx/records-proxy.conf; }
  }
  server {
    listen 8082;
    server_name bookplate.utilibre.org;
    include /etc/nginx/records-headers.conf;
    location /utilibre-source/ { alias /srv/source/; }
    # Native signup is accessible only to local operator provisioning.
    location /api/auth/sign-up/ { return 403; }
    location = /api/client-errors { return 404; }
    # User images must pass the native per-account API authorization.
    location /uploads/ { return 404; }
    location /s/ { return 404; }
    location ~ ^/api/(showcase|metrics|contact) { return 404; }
    location / { proxy_pass http://172.29.158.13:3000; include /etc/nginx/records-proxy.conf; }
  }
}
