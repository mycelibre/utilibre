acl CONNECT method CONNECT
acl approved dstdomain openlibrary.org covers.openlibrary.org .archive.org itunes.apple.com .mzstatic.com en.wiktionary.org
acl forbidden dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3 ::/0
http_access deny !bookplate
