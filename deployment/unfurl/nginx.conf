worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events {worker_connections 256;}
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 8k;
  client_header_timeout 5s;
  client_body_timeout 5s;
  keepalive_timeout 15s;
  set_real_ip_from 10.10.1.0/24;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=per_client:1m rate=6r/m;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  limit_conn_zone $server_name zone=global_jobs:1m;
  limit_req_status 429;
  limit_conn_status 429;
  server {
    listen 8080;
    server_name _;
    add_header Cache-Control 'no-store' always;
    add_header Referrer-Policy 'no-referrer' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location = /health { return 200 'ok'; }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /robots.txt { return 200 'User-agent: *\nDisallow:\n'; }
    location /json/ {
      limit_req zone=per_client burst=2 nodelay;
      limit_conn connections 2;
      limit_conn global_jobs 2;
      proxy_connect_timeout 3s;
      proxy_read_timeout 18s;
      proxy_send_timeout 5s;
      proxy_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For '';
      proxy_set_header Cookie '';
      proxy_set_header Authorization '';
      proxy_pass http://172.29.122.10:5000;
    }
    location / {
      limit_except GET HEAD {deny all;}
      proxy_connect_timeout 3s;
      proxy_read_timeout 18s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For '';
      proxy_set_header Cookie '';
      proxy_set_header Authorization '';
      proxy_pass http://172.29.122.10:5000;
    }
  }
}
