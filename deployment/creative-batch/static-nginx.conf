worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 512; }
http {
include /etc/nginx/mime.types;
access_log off;
server_tokens off;
client_body_temp_path /tmp/client;
proxy_temp_path /tmp/proxy;
fastcgi_temp_path /tmp/fastcgi;
uwsgi_temp_path /tmp/uwsgi;
scgi_temp_path /tmp/scgi;
server {
listen 3230;
server_name openreel.utilibre.org;
root /srv/sites/openreel;
index index.html;
allow 10.10.1.3; allow 10.10.1.43; allow 127.0.0.1; allow 172.29.160.1; allow 172.29.161.1; deny all;
add_header Referrer-Policy no-referrer always;
add_header X-Content-Type-Options nosniff always;
add_header Cache-Control "no-cache, no-transform" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob: data:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
location /utilibre-source/ { alias /srv/source/openreel/; }
location ~ \.(php|pl|coffee|map)$ { return 404; }
location /api/ { return 404; }
location / { try_files $uri $uri/ =404; limit_except GET { deny all; } }
}
