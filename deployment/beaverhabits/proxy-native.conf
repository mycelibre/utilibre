proxy_pass http://172.29.145.10:8080;
proxy_http_version 1.1;
proxy_set_header Host habits.utilibre.org;
proxy_set_header X-Forwarded-Host habits.utilibre.org;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_hide_header Cache-Control;
proxy_buffering off;
proxy_max_temp_file_size 0;
proxy_read_timeout 90s;

# Native session cookies are used only through the public HTTPS gateway.
proxy_cookie_flags session secure;
