worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $uri $cache_control { default 'private, no-store'; ~^/(statics|_nicegui)/static/ 'public, max-age=3600'; }
  limit_req_zone $binary_remote_addr zone=login:1m rate=20r/m;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  limit_req_status 429;
  server {
    listen 8080;
    server_name habits.utilibre.org;
    client_max_body_size 2m;
    client_body_timeout 15s;
    limit_conn connections 32;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $cache_control always;
    # NiceGUI renders its UI with native inline scripts and Vue expression evaluation.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://habits.utilibre.org; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    location = /robots.txt { default_type text/plain; return 200 'User-agent: *\nAllow: /\n'; }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location ~ ^/(debug|metrics|demo|google)(/|$) { return 404; }
    location ~ ^/auth/(forgot-password|request-verify-token)/?$ { return 404; }
    location /auth/ {
      limit_req zone=login burst=5 nodelay;
      include /etc/nginx/proxy-native.conf;
    }
    location / { include /etc/nginx/proxy-native.conf; }
  }
}
