worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=calendar:1m rate=20r/s;
  set_real_ip_from 10.10.1.0/24;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  server {
    listen 8080;
    absolute_redirect off;
    root /srv/calino;
    client_max_body_size 10m;
    client_body_timeout 15s;
    limit_req zone=calendar burst=80 nodelay;
    limit_req_status 429;
    add_header X-Robots-Tag noindex always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Qh5qqVHNcx0NmWPlYwpmDet5mMrPYpSQ6hcLzJTT3ZM=' 'sha256-AQQMVAHv1tQqIVb/aeGQWZo8IWdCg5J5kzrOTtjqgCY='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /healthz { return 200 "ok\n"; }
    # Permit crawling of already-public responses so noindex can be observed.
    # Authentication and DAV/manager permissions still govern private content.
    location = /robots.txt {
      default_type text/plain;
      charset utf-8;
      return 200 "User-agent: *\nDisallow:\n";
    }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /.well-known/jmap { return 404; }
    location = /.well-known/caldav { return 301 /dav/; }
    location = /.well-known/carddav { return 301 /dav/; }
    location = /dav { return 301 /dav/; }
    location /dav/ {
      proxy_pass http://radicale:5232/;
      proxy_set_header X-Script-Name /dav;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Remote-User "";
      proxy_set_header Authorization $http_authorization;
      proxy_connect_timeout 3s;
      proxy_read_timeout 35s;
      proxy_send_timeout 35s;
      proxy_buffering off;
    }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
  }
}
