name: utilibre-calendar
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 96
  mem_limit: 256m
  cpus: 1
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  radicale:
    <<: *runtime
    image: utilibre-radicale:3.8.3
    build:
      context: .
      dockerfile: Dockerfile.radicale
    volumes:
      - ./radicale.conf:/etc/radicale/config:ro
      - /opt/utilibre/calendar-private:/run/radicale:ro
      - /opt/utilibre/calendar-data:/var/lib/radicale
    networks:
      calendar: {ipv4_address: 172.29.112.10}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:5232/.web/').status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
  calino:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    cpus: 0.5
    mem_limit: 128m
    ports: ["10.10.1.43:3197:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/utilibre/calendar-static:/srv/calino:ro
    networks: [calendar, ingress]
    depends_on: [radicale]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  ingress:
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.113.0/24}]}
  calendar:
    internal: true
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.112.0/24}]}
