enabled = true;
skip_local = false;
skip_authenticated = false;
use = ["remove-headers", "authentication-results", "add_dmarc_allow_header"];
routines {
  remove-headers {
    headers {
      "X-AnonAddy-Dmarc-Allow" = 0;
      "X-AnonAddy-Authentication-Results" = 0;
      "X-AnonAddy-Spam" = 0;
      "X-AnonAddy-Should-Quarantine" = 0;
      "X-AnonAddy-Quarantine-Reason" = 0;
    }
  }
  authentication-results { header = "X-AnonAddy-Authentication-Results"; remove = 0; }
}
custom {
  # Pinned upstream Addy routine: only a newly computed DMARC pass authorizes.
  add_dmarc_allow_header = <<EOD
return function(task, common_meta)
  if task:has_symbol('DMARC_POLICY_ALLOW') then
    return nil,
      {['X-AnonAddy-Dmarc-Allow'] = 'Yes'},
      {['X-AnonAddy-Dmarc-Allow'] = 0},
      {}
  end
  return nil, {}, {['X-AnonAddy-Dmarc-Allow'] = 0}, {}
end
EOD;
}
