enabled = true;
check_local = true;
check_authed = true;
reporting { enabled = false; }
# PMG is the SMTP peer. SPF alone cannot authenticate the original remote sender.
# Annotate authentication; native Addy decides whether a reply/send is permitted.
# Do not reject all ordinary forwarded mail solely on this private-hop SPF result.
actions { reject = "no action"; quarantine = "no action"; softfail = "no action"; }
