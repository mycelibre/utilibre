name: utilibre-addy
services:
  db:
    image: mariadb:12.2@sha256:6a4c4bbf0447c2247801309513fcc0dd17c3f35390368139ce419387fdd1144d
    command: [mariadbd, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --innodb-buffer-pool-size=64M, --max-connections=30]
    env_file: [/opt/utilibre/addy/private/db.env]
    volumes: [/opt/utilibre/addy/data/mysql:/var/lib/mysql]
    networks: {data: {ipv4_address: 172.29.133.20}}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 96
    security_opt: [no-new-privileges:true]
    healthcheck: {test: [CMD, healthcheck.sh, --connect, --innodb_initialized], interval: 10s, timeout: 5s, retries: 10}
    logging: {driver: json-file, options: {max-size: 1m, max-file: '2'}}
  redis:
    image: redis:8.6-alpine@sha256:ac2da09bc822f325a9f68f533120b86fa39c1b8db46b3aa7c1bbea7fdfd4fcba
    command: [redis-server, --maxmemory, 32mb, --maxmemory-policy, noeviction, --appendonly, 'no', --save, '']
    networks: {data: {ipv4_address: 172.29.133.21}}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: '999:999'
    pids_limit: 48
    cpus: 0.25
    mem_limit: 64m
    logging: {driver: json-file, options: {max-size: 1m, max-file: '2'}}
  app:
    image: utilibre-addy:1.7.3
    # Native s6/Postfix image generates configuration and drops privileges internally.
    # Writable image root/default Docker capabilities are required by that native entrypoint.
    security_opt: [no-new-privileges:true]
    env_file: [/opt/utilibre/addy/private/app.env, ./relay.env]
    entrypoint: [sh, /smtp-entrypoint.sh]
    volumes: [/opt/utilibre/addy/data/app:/data, ./90-utilibre-relay-config:/etc/cont-init.d/90-utilibre-relay-config:ro, ./reply-header-checks:/etc/postfix/utilibre-reply-header-checks:ro, ./rspamd:/etc/utilibre-rspamd:ro, ./rspamd/91-utilibre-reply-auth:/etc/cont-init.d/91-utilibre-reply-auth:ro, ./smtp-entrypoint.sh:/smtp-entrypoint.sh:ro, /run/utilibre-addy-smtp:/smtp-startup:ro]
    extra_hosts: [mx.mailgt.dev:10.10.1.20]
    networks: {data: {ipv4_address: 172.29.133.10}, ingress: {ipv4_address: 172.29.134.10}}
    ports: ['10.10.1.43:2527:25']
    restart: "no"
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
    logging: {driver: json-file, options: {max-size: 1m, max-file: '2'}}
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    user: '101:101'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 48
    cpus: 0.25
    mem_limit: 64m
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777']
    entrypoint: [nginx, -g, 'daemon off;']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1:3211:8080', '10.10.1.43:3211:8080']
    networks: {data: {ipv4_address: 172.29.133.50}, ingress: {ipv4_address: 172.29.134.50}}
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 1m, max-file: '2'}}
networks:
  data: {internal: true, ipam: {config: [{subnet: 172.29.133.0/24}]}}
  ingress: {ipam: {config: [{subnet: 172.29.134.0/24}]}}
