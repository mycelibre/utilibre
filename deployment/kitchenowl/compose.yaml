name: utilibre-kitchenowl
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging:
    driver: json-file
    options: {max-size: 1m, max-file: '2'}
services:
  app:
    <<: *runtime
    image: utilibre-kitchenowl:0.7.10-p1
    build: .
    user: '1000:1000'
    env_file: /opt/utilibre/kitchenowl/private/app.env
    environment:
      FRONT_URL: https://kitchen.utilibre.org
      PRIVACY_POLICY_URL: https://utilibre.org/en/privacy
      TERMS_URL: https://utilibre.org/en/acceptable-use
      OIDC_ISSUER: https://auth.utilibre.org/application/o/kitchenowl/
      OIDC_CLIENT_ID: utilibre-kitchenowl
      DISABLE_USERNAME_PASSWORD_LOGIN: 'true'
      DISABLE_ONBOARDING: 'true'
      OPEN_REGISTRATION: 'false'
      COLLECT_METRICS: 'false'
      KITCHENOWL_MCP_ENABLED: 'false'
      DEBUG: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      LITELLM_TELEMETRY: 'false'
      LLM_MODEL: ''
      LLM_API_URL: ''
      STORAGE_PATH: /data
    extra_hosts: ['auth.utilibre.org:10.10.1.3']
    command: [--ini, 'wsgi.ini:web', --gevent, '100', --max-fd, '4096', --disable-logging]
    mem_limit: 768m
    cpus: 1.5
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777']
    volumes: [/opt/utilibre/kitchenowl/data:/data]
    networks:
      app: {ipv4_address: 172.29.131.10}
  gateway:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    mem_limit: 96m
    cpus: 0.5
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777']
    # Onboarding and password/public registration are disabled before exposure.
    ports: ['10.10.1.43:3202:8080', '127.0.0.1:3202:8080']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on: [app]
    networks:
      app: {ipv4_address: 172.29.131.20}
networks:
  app:
    ipam: {config: [{subnet: 172.29.131.0/24}]}
