name: utilibre-structables
services:
  structables:
    image: utilibre-structables:0.4.5-p1-20261027
    restart: unless-stopped
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    pids_limit: 64
    logging: {driver: none}
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777']
    environment:
      STRUCTABLES_CACHE_ENABLED: 'false'
      STRUCTABLES_PRIVACY_FILE: /app/privacy.md
    volumes:
      - ./privacy.md:/app/privacy.md:ro
      - /opt/utilibre/toolbox-public:/source:ro
    ports:
      - target: 8002
        published: '${STRUCTABLES_PORT:-3242}'
        host_ip: '${PRIVATE_BIND_IP:?Set the exact private bind address}'
        protocol: tcp
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
