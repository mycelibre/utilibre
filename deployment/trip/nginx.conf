worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
  access_log off;
  map $uri $cache_policy { default no-cache; ~^/api/ no-store; }
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 10m;
  client_body_timeout 15s;
  limit_req_zone $server_name zone=providers:1m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api:1m rate=5r/s;
  limit_conn_zone $server_name zone=connections:1m;
  limit_req_status 429;
  limit_conn_zone $server_name zone=provider_connections:1m;
  limit_conn_status 429;
  server {
    listen 8080;
    server_name trip-pilot;
    limit_conn connections 16;
    add_header Cache-Control $cache_policy always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For '';
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\n"; }
    location ~ ^/api/completions/(bulk|mymaps-import|takeout-import|google)(/|$) { return 403; }
    location = /api/settings/checkversion { return 403; }
    location /api/completions/ {
      limit_req zone=providers;
      limit_conn provider_connections 1;
      proxy_pass http://172.29.152.10:8000;
    }
    location /api/ {
      limit_req zone=api burst=15 nodelay;
      proxy_pass http://172.29.152.10:8000;
    }
    location / {
      proxy_pass http://172.29.152.10:8000;
    }
  }
}
