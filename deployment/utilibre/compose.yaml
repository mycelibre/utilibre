name: utilibre-services

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: docker.io/library/postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: "70:70"
    restart: unless-stopped
    <<: *default-security
    cap_drop: [ALL]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
      FRESHRSS_DB_PASSWORD: ${FRESHRSS_DB_PASSWORD:?Set FRESHRSS_DB_PASSWORD}
      TZ: ${TZ:-America/Guatemala}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_wal_size=1GB
      - -c
      - log_statement=none
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/postgres/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    logging: *default-logging

  valkey:
    image: docker.io/valkey/valkey:9.1.1-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    user: "999:1000"
    restart: unless-stopped
    read_only: true
    <<: *default-security
    cap_drop: [ALL]
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--loglevel", "warning", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    tmpfs:
      - /data:rw,nosuid,nodev,noexec,size=320m,mode=1777
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100
    logging: *default-logging

  freshrss:
    image: docker.io/freshrss/freshrss:1.29.1@sha256:ab6b363102ccdbc39f6a62db926f567c61a5289bf25ba460f1c34423d8cc1a4d
    init: true
    restart: unless-stopped
    <<: *default-security
    ports:
      - target: 80
        published: "${FRESHRSS_PORT:-3106}"
        host_ip: "${APP_BIND_IP:?Set APP_BIND_IP}"
        protocol: tcp
    environment:
      TZ: ${TZ:-America/Guatemala}
      CRON_MIN: "13,43"
      FRESHRSS_ENV: production
      TRUSTED_PROXY: ${EDGE_PROXY_IP:?Set EDGE_PROXY_IP}
    volumes:
      - ./data/freshrss/data:/var/www/FreshRSS/data
      - ./data/freshrss/extensions:/var/www/FreshRSS/extensions
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/var/www/FreshRSS/cli/health.php"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks: [frontend, backend]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging: *default-logging

  # RSSHub is private support infrastructure for FreshRSS. It has no host port
  # or public edge route. Its dedicated second network provides upstream egress
  # without joining the network used by host-published applications.
  rsshub:
    image: ghcr.io/diygod/rsshub@sha256:0e0ee34e7288664ada039a816835ee28cc86767412d2c23f64e37a7320908f6c
    init: true
    restart: unless-stopped
    read_only: true
    <<: *default-security
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://valkey:6379/
      REQUEST_RETRY: "2"
      REQUEST_TIMEOUT: "30000"
      CACHE_REQUEST_TIMEOUT: "60"
      CACHE_EXPIRE: "300"
      CACHE_CONTENT_EXPIRE: "3600"
      DEBUG_INFO: "false"
      NO_LOGFILES: "true"
      LOGGER_LEVEL: info
      ALLOW_USER_SUPPLY_UNSAFE_DOMAIN: "false"
      FILTER_REGEX_ENGINE: re2
      ALLOW_USER_HOTLINK_TEMPLATE: "false"
      ENABLE_REMOTE_DEBUGGING: "false"
      TZ: ${TZ:-America/Guatemala}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1200/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [backend, rsshub-egress]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    logging: *default-logging

  privatebin:
    image: docker.io/privatebin/nginx-fpm-alpine:2.0.6@sha256:13290e2f04bfd98cf8fc7e8d216fb76b2b2d12373d4923b859cd41c2d984fde8
    user: "65534:82"
    restart: unless-stopped
    read_only: true
    <<: *default-security
    cap_drop: [ALL]
    ports:
      - target: 8080
        published: "${PRIVATEBIN_PORT:-3108}"
        host_ip: "${APP_BIND_IP:?Set APP_BIND_IP}"
        protocol: tcp
    environment:
      TZ: ${TZ:-America/Guatemala}
      PHP_TZ: ${TZ:-America/Guatemala}
    volumes:
      - ./config/privatebin/conf.php:/srv/cfg/conf.php:ro
      - ./data/privatebin:/srv/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /run:rw,exec,nosuid,nodev,size=16m,mode=0755,uid=65534,gid=82
      - /var/lib/nginx/tmp:rw,nosuid,nodev,noexec,size=32m,mode=0755,uid=65534,gid=82
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [frontend]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging

networks:
  rsshub-egress:
    name: utilibre-services_rsshub-egress
  frontend:
    name: utilibre-services_frontend
  backend:
    name: utilibre-services_backend
    internal: true
