# Only the exact homepage and named branding assets omit noindex. HEAD mirrors GET.
# Native HTML has an additional error/action gate and never indexes paste queries.
set $utilibre_discovery_key "$request_method:$request_uri";
set $utilibre_private_robots "noindex, nofollow, noarchive";
if ($utilibre_discovery_key ~ "^(GET|HEAD):/$") {
    set $utilibre_private_robots "";
}
if ($utilibre_discovery_key ~ "^(GET|HEAD):/(favicon\.ico|manifest\.json|utilibre-brand/(favicon-48\.png|apple-touch-icon-180\.png|icon-512\.png))$") {
    set $utilibre_private_robots "";
}
