# Served by the existing static gateway; no LaTeX execution on the server.
server {
  listen 8087;
  server_name latex.utilibre.org;
  root /srv/utilibre-source/apps/texlyre;
  index index.html;
  access_log off;
  error_log /dev/null crit;
  allow 10.10.1.3;
  allow 10.10.1.43;
  allow 172.23.0.1;
  allow 127.0.0.1;
  deny all;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  client_max_body_size 64k;
  autoindex off;
  gzip on;
  gzip_types application/javascript application/wasm text/css application/json;
  add_header Cache-Control "no-cache, no-transform" always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
  location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
  location = /utilibre-source/texlyre-utilibre.tar.gz { alias /srv/utilibre-source/texlyre-utilibre.tar.gz; }
  location / { try_files $uri $uri/ =404; }
}
