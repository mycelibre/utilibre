worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.0/24;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=create:1m rate=2r/m;
  limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
  server {
    listen 8080;
    client_max_body_size 8k;
    client_body_timeout 10s;
    limit_req_status 429;
    add_header X-Robots-Tag noindex always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_flags ~ secure httponly samesite=strict;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    location = /healthz { proxy_pass http://app:4567/api/version; }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /api/new { limit_req zone=create burst=4 nodelay; proxy_pass http://app:4567; }
    location = /api/login { limit_req zone=login burst=4 nodelay; proxy_pass http://app:4567; }
    location / { proxy_pass http://app:4567; }
  }
}
