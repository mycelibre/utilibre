name: utilibre-wikimore
services:
  wikimore:
    image: utilibre-wikimore:0.1.27-p1-20261124
    restart: unless-stopped
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    pids_limit: 64
    logging: {driver: none}
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=24m,mode=1777']
    environment:
      WIKIMORE_INSTANCE_HOSTNAME: wikimore.utilibre.org
      WIKIMORE_LANGSORT: es,en
      WIKIMORE_CACHE_TYPE: SimpleCache
      WIKIMORE_CACHE_TIMEOUT: '1800'
      WIKIMORE_CACHE_THRESHOLD: '64'
      WIKIMORE_WORKERS: '2'
    volumes:
      - /opt/utilibre/toolbox-public:/source:ro
    ports:
      - target: 8109
        published: '3244'
        host_ip: '${PRIVATE_BIND_IP:?Set exact private bind address}'
        protocol: tcp
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8109/healthz', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
