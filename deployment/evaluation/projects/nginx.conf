worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $uri $cache_control { default 'private, no-store'; ~^/static/ 'public, max-age=31536000, immutable'; }
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  server {
    # This pilot has no published port. A production edge route is not enabled.
    listen 1337;
    server_name projects.invalid;
    client_max_body_size 10m;
    client_body_timeout 20s;
    limit_conn connections 32;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $cache_control always;
    # Native runtime settings are an inline script; styles are generated by the
    # existing UI library. External images/widgets/frames are deliberately denied.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://projects.invalid:1337; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://auth.utilibre.org" always;
    location = /robots.txt { default_type text/plain; return 200 'User-agent: *\nAllow: /\n'; }
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location / {
      proxy_pass http://app:1337;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_hide_header Cache-Control;
      proxy_hide_header Content-Security-Policy;
      proxy_request_buffering on;
      proxy_buffering off;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 90s;
    }
  }
}
