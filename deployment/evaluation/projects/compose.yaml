name: utilibre-projects-pilot
services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    entrypoint: [nginx, -g, 'daemon off;']
    user: '101:101'
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    networks: [isolated]
    depends_on: [app]
    restart: 'no'
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    logging: {driver: json-file, options: {max-size: 1m, max-file: '2'}}
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    env_file: /opt/utilibre/evaluation/projects-20261009/private/pilot.env
    volumes: [db:/var/lib/postgresql/data]
    networks: [isolated]
    restart: 'no'
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U projects -d projects']
      interval: 3s
      timeout: 2s
      retries: 20
    logging: {driver: json-file, options: {max-size: 1m, max-file: '2'}}
  app:
    image: utilibre-projects-pilot:455aa274-p1
    env_file: /opt/utilibre/evaluation/projects-20261009/private/pilot.env
    depends_on: {db: {condition: service_healthy}}
    # Internal network only. The test browser maps projects.invalid to its
    # private container address; no host or public listener is published.
    volumes:
      - /opt/utilibre/evaluation/projects-20261009/data/avatars:/app/public/user-avatars
      - /opt/utilibre/evaluation/projects-20261009/data/backgrounds:/app/public/project-background-images
      - /opt/utilibre/evaluation/projects-20261009/data/attachments:/app/attachments
    networks: [isolated]
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
      - /app/logs:rw,nosuid,nodev,noexec,size=16m,uid=1000,gid=1000,mode=0750
      - /app/.tmp:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000,mode=0750
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    pids_limit: 96
    logging: {driver: json-file, options: {max-size: 1m, max-file: '2'}}
networks:
  isolated: {internal: true}
volumes:
  db:
