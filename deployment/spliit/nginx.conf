worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 10.10.1.3;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $request_method $write_limit { default $binary_remote_addr; GET ""; HEAD ""; OPTIONS ""; }
  map $uri $cache_policy { default "private, no-store"; ~^/_next/static/ "public, max-age=31536000, immutable"; }
  limit_req_zone $write_limit zone=writes:1m rate=30r/m;
  limit_req_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 128k;
    # Link-bearing group pages must not enter shared caches or search indexes.
    add_header Cache-Control $cache_policy always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    location = /.well-known/security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /security.txt { return 302 https://utilibre.org/.well-known/security.txt; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow:\n"; }
    # Disabled natively too. No upload credentials or AI keys exist here.
    location = /api/s3-upload { return 404; }
    location / {
      limit_req zone=writes burst=30 nodelay;
      set $backend http://app:3000;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host expenses.utilibre.org;
      proxy_set_header X-Forwarded-Host expenses.utilibre.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Cache-Control;
      proxy_hide_header Referrer-Policy;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
