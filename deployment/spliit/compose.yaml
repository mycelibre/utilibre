name: utilibre-spliit

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 96
  logging:
    driver: json-file
    options: {max-size: 1m, max-file: "2"}

services:
  app:
    <<: *runtime
    image: utilibre-spliit:1.29.0-p1
    build: /opt/utilibre/community-src/spliit-utilibre-1.29.0-p1
    user: "1000:1000"
    env_file: /opt/utilibre/spliit/private/app.env
    environment:
      BASE_URL: https://expenses.utilibre.org
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
      ANALYTICS_PROVIDER: ""
      ENABLE_EXPENSE_DOCUMENTS: "false"
      NEXT_PUBLIC_ENABLE_EXPENSE_DOCUMENTS: "false"
      ENABLE_RECEIPT_EXTRACT: "false"
      NEXT_PUBLIC_ENABLE_RECEIPT_EXTRACT: "false"
      ENABLE_CATEGORY_EXTRACT: "false"
      NEXT_PUBLIC_ENABLE_CATEGORY_EXTRACT: "false"
      DEFAULT_CURRENCY_CODE: USD
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    cpus: 1
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /usr/app/.next/cache:rw,nosuid,nodev,size=64m,uid=1000,gid=1000
    networks:
      data: {ipv4_address: 172.29.110.10}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
  db:
    <<: *runtime
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: "70:70"
    env_file: /opt/utilibre/spliit/private/db.env
    command: [postgres, -c, max_connections=30, -c, shared_buffers=64MB, -c, log_statement=none, -c, log_parameter_max_length_on_error=0]
    mem_limit: 256m
    cpus: 0.5
    volumes: [/opt/utilibre/spliit/data:/var/lib/postgresql/data]
    tmpfs: ["/var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,uid=70,gid=70"]
    networks:
      data: {ipv4_address: 172.29.110.20}
    healthcheck:
      test: [CMD, pg_isready, -U, spliit, -d, spliit]
      interval: 10s
      timeout: 5s
      retries: 5
  gateway:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    mem_limit: 96m
    cpus: 0.5
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["10.10.1.43:3190:8080", "127.0.0.1:3190:8080"]
    networks:
      data: {ipv4_address: 172.29.110.30}
      front: {ipv4_address: 172.29.111.10}
    depends_on: [app]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health/readiness]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  data:
    internal: true
    ipam: {config: [{subnet: 172.29.110.0/24}]}
  front:
    ipam: {config: [{subnet: 172.29.111.0/24}]}
