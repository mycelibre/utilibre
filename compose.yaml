name: ${COMPOSE_PROJECT_NAME:-public-utility}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-3}"

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  portal:
    build:
      context: ./portal
    image: ${PORTAL_IMAGE:-public-utility-portal:0.1.0}
    init: true
    restart: unless-stopped
    read_only: true
    <<: *default-security
    ports:
      - target: 8080
        published: "${PORTAL_PORT:-8080}"
        host_ip: "${PRIVATE_BIND_IP:?Set PRIVATE_BIND_IP}"
        protocol: tcp
    environment:
      TZ: ${TZ:-America/Guatemala}
      PORT: "8080"
      PROJECT_NAME: ${PROJECT_NAME:-Utilibre}
      PROJECT_TAGLINE: ${PROJECT_TAGLINE:-}
      PROJECT_TAGLINE_EN: ${PROJECT_TAGLINE_EN:-}
      PROJECT_TAGLINE_ES: ${PROJECT_TAGLINE_ES:-}
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
      CONTACT_URL: ${CONTACT_URL:-}
      PUBLIC_SEARCH_URL: ${PUBLIC_SEARCH_URL:-}
      PUBLIC_REDDIT_URL: ${PUBLIC_REDDIT_URL:-}
      PUBLIC_YOUTUBE_URL: ${PUBLIC_YOUTUBE_URL:-}
      PUBLIC_IMGUR_URL: ${PUBLIC_IMGUR_URL:-}
      PUBLIC_NTFY_URL: ${PUBLIC_NTFY_URL:-}
      PUBLIC_PDF_URL: ${PUBLIC_PDF_URL:-}
      PUBLIC_CONVERT_URL: ${PUBLIC_CONVERT_URL:-}
      PUBLIC_TOOLS_URL: ${PUBLIC_TOOLS_URL:-}
      PUBLIC_MONITOR_URL: ${PUBLIC_MONITOR_URL:-}
      PUBLIC_SEND_URL: ${PUBLIC_SEND_URL:-}
      PUBLIC_RSS_URL: ${PUBLIC_RSS_URL:-}
      PUBLIC_FEEDS_URL: ${PUBLIC_FEEDS_URL:-}
      PUBLIC_PASTE_URL: ${PUBLIC_PASTE_URL:-}
      PUBLIC_WAKAPI_URL: ${PUBLIC_WAKAPI_URL:-}
      ENABLED_SERVICES: ${ENABLED_SERVICES:-cobalt,searxng}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      PRIVATE_PREVIEW: ${PORTAL_PRIVATE_PREVIEW:-${PRIVATE_PREVIEW:-0}}
      PRIVATE_BIND_IP: ${PRIVATE_BIND_IP:?Set PRIVATE_BIND_IP}
      EDGE_PROXY_IP: ${PORTAL_EDGE_PROXY_IP:-${EDGE_PROXY_IP:-}}
      COBALT_INTERNAL_URL: http://cobalt:9000/
      COBALT_PUBLIC_API_URL: ${PORTAL_COBALT_BROWSER_URL:-${COBALT_PUBLIC_API_URL:?Set COBALT_PUBLIC_API_URL}}
      COBALT_RESULT_SOURCE_URL: ${PORTAL_COBALT_RESULT_SOURCE_URL:-${COBALT_PUBLIC_API_URL:?Set COBALT_PUBLIC_API_URL}}
      COBALT_API_KEY_FILE: /run/secrets/portal-cobalt-key
      COBALT_ALLOWED_HOSTS: ${COBALT_ALLOWED_HOSTS:-dailymotion.com,dai.ly}
      MEDIA_ALLOWED_ORIGINS: ${PORTAL_PUBLIC_ORIGIN:-${PUBLIC_PORTAL_ORIGIN:?Set PUBLIC_PORTAL_ORIGIN}}
      MEDIA_RATE_WINDOW_SECONDS: ${MEDIA_RATE_WINDOW_SECONDS:-600}
      MEDIA_RATE_LIMIT: ${MEDIA_RATE_LIMIT:-10}
      MEDIA_MAX_CONCURRENT: ${MEDIA_MAX_CONCURRENT:-2}
      MEDIA_REQUEST_TIMEOUT_SECONDS: ${MEDIA_REQUEST_TIMEOUT_SECONDS:-45}
      STATUS_CACHE_SECONDS: ${STATUS_CACHE_SECONDS:-15}
      WEBHOOK_INBOX_ENABLED: ${WEBHOOK_INBOX_ENABLED:-1}
      DNS_LOOKUP_ENABLED: ${DNS_LOOKUP_ENABLED:-1}
      STATUS_SERVICES: >-
        cobalt=http://cobalt:9000/,
        searxng=http://searxng:8080/healthz,
        redlib=http://redlib:8080/settings,
        ntfy=${PUBLIC_NTFY_URL:?Set PUBLIC_NTFY_URL}v1/health,
        bentopdf=http://${PRIVATE_BIND_IP}:${BENTOPDF_PORT:-3101}/,
        vert=http://${PRIVATE_BIND_IP}:${VERT_PORT:-3102}/,
        omnitools=http://${PRIVATE_BIND_IP}:${OMNITOOLS_PORT:-3103}/,
        healthchecks=http://${PRIVATE_BIND_IP}:${HEALTHCHECKS_PORT:-3104}/api/v3/status/#host=monitor.utilibre.org,
        pairdrop=http://${PRIVATE_BIND_IP}:${PAIRDROP_PORT:-3105}/,
        freshrss=http://${PRIVATE_BIND_IP}:${FRESHRSS_PORT:-3106}/i/,
        rsshub=http://${PRIVATE_BIND_IP}:${RSSHUB_PORT:-3107}/healthz,
        privatebin=http://${PRIVATE_BIND_IP}:${PRIVATEBIN_PORT:-3108}/,
        wakapi=http://${PRIVATE_BIND_IP}:${WAKAPI_PORT:-3109}/api/health,
        rimgo=http://rimgo:3000/
    secrets:
      - source: portal_cobalt_key
        target: portal-cobalt-key
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - services
    deploy:
      resources:
        limits:
          cpus: "${PORTAL_CPU_LIMIT:-0.50}"
          memory: ${PORTAL_MEMORY_LIMIT:-256M}
          pids: 128
        reservations:
          memory: 64M
    logging: *default-logging

  cobalt:
    image: ghcr.io/imputnet/cobalt:11.7.1-a636575@sha256:63186dd68afd57ce3bb1f62cc4c139f5fa95b9c3e87a3cf5c6e4c7a570523f62
    init: true
    restart: unless-stopped
    read_only: true
    <<: *default-security
    ports:
      - target: 9000
        published: "${COBALT_PORT:-9000}"
        host_ip: "${PRIVATE_BIND_IP:?Set PRIVATE_BIND_IP}"
        protocol: tcp
    environment:
      TZ: ${TZ:-America/Guatemala}
      API_URL: ${COBALT_PUBLIC_API_URL:?Set COBALT_PUBLIC_API_URL}
      API_PORT: "9000"
      API_INSTANCE_COUNT: "1"
      API_KEY_URL: file:///run/secrets/cobalt-keys.json
      API_AUTH_REQUIRED: "1"
      CORS_WILDCARD: "0"
      CORS_URL: ${PUBLIC_PORTAL_ORIGIN:?Set PUBLIC_PORTAL_ORIGIN}
      DURATION_LIMIT: ${COBALT_DURATION_LIMIT_SECONDS:-1800}
      TUNNEL_LIFESPAN: ${COBALT_TUNNEL_LIFESPAN_SECONDS:-90}
      RATELIMIT_WINDOW: ${COBALT_RATELIMIT_WINDOW_SECONDS:-60}
      RATELIMIT_MAX: ${COBALT_RATELIMIT_MAX:-30}
      TUNNEL_RATELIMIT_WINDOW: ${COBALT_TUNNEL_RATELIMIT_WINDOW_SECONDS:-60}
      TUNNEL_RATELIMIT_MAX: ${COBALT_TUNNEL_RATELIMIT_MAX:-120}
      PROCESSING_PRIORITY: ${COBALT_PROCESSING_PRIORITY:-10}
      FORCE_LOCAL_PROCESSING: never
      YOUTUBE_ALLOW_BETTER_AUDIO: "0"
      ENABLE_DEPRECATED_YOUTUBE_HLS: never
      DISABLED_SERVICES: ${COBALT_DISABLED_SERVICES:-bilibili,bluesky,facebook,instagram,loom,ok,pinterest,reddit,rutube,snapchat,soundcloud,streamable,tiktok,tumblr,twitch,twitter,vimeo,vk,youtube}
    secrets:
      - source: cobalt_keys
        target: cobalt-keys.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - services
    deploy:
      resources:
        limits:
          cpus: "${COBALT_CPU_LIMIT:-1.50}"
          memory: ${COBALT_MEMORY_LIMIT:-1536M}
          pids: ${COBALT_PIDS_LIMIT:-256}
        reservations:
          memory: ${COBALT_MEMORY_RESERVATION:-256M}
    logging: *default-logging

  searxng:
    image: docker.io/searxng/searxng:2026.8.22-9fea41204@sha256:11a9b34cdc0b1ec2b991470a2762ecb5a1a531898289fb51dcd015260450729e
    restart: unless-stopped
    ports:
      - target: 8080
        published: "${SEARXNG_PORT:-8888}"
        host_ip: "${PRIVATE_BIND_IP:?Set PRIVATE_BIND_IP}"
        protocol: tcp
    environment:
      TZ: ${TZ:-America/Guatemala}
      SEARXNG_BASE_URL: ${PUBLIC_SEARCH_URL:?Set PUBLIC_SEARCH_URL}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET}
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
      PYTHONPATH: /etc/searxng
    volumes:
      - ./config/searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q OK"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - services
      - search-state
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "${SEARXNG_CPU_LIMIT:-1.00}"
          memory: ${SEARXNG_MEMORY_LIMIT:-768M}
          pids: 256
        reservations:
          memory: 192M
    logging: *default-logging

  valkey:
    image: docker.io/valkey/valkey:9.1.1-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    restart: unless-stopped
    read_only: true
    user: "999:1000"
    <<: *default-security
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--loglevel", "warning", "--maxmemory", "${VALKEY_MAXMEMORY:-96mb}", "--maxmemory-policy", "allkeys-lru"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
      - /data:rw,nosuid,nodev,noexec,size=${VALKEY_DATA_TMPFS_SIZE:-128m},mode=1777
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - search-state
    deploy:
      resources:
        limits:
          cpus: "${VALKEY_CPU_LIMIT:-0.25}"
          memory: ${VALKEY_MEMORY_LIMIT:-128M}
          pids: 100
        reservations:
          memory: 32M
    logging: *default-logging

  # Anubis is a specialized anti-bot gate for Redlib, not a general-purpose
  # reverse proxy. It owns the existing private Redlib ingress port so the
  # separate edge Caddy route does not need to change. Redlib itself is
  # reachable only on this Docker network.
  anubis:
    profiles: ["privacy-frontends"]
    image: ghcr.io/techarohq/anubis:v1.27.0@sha256:8828275668b7bc675679f100970f9714f731388fbbf66ae94de8aca952e3fc4a
    init: true
    restart: unless-stopped
    read_only: true
    <<: *default-security
    ports:
      - target: 8080
        published: "${REDLIB_PORT:-3002}"
        host_ip: "${PRIVATE_BIND_IP:?Set PRIVATE_BIND_IP}"
        protocol: tcp
    environment:
      BIND: ":8080"
      METRICS_BIND: ":9090"
      TARGET: "http://redlib:8080"
      REDIRECT_DOMAINS: "${ANUBIS_PUBLIC_HOST:?Set ANUBIS_PUBLIC_HOST}"
      CUSTOM_REAL_IP_HEADER: "${ANUBIS_REAL_IP_HEADER:-CF-Connecting-IP}"
      COOKIE_EXPIRATION_TIME: "${ANUBIS_COOKIE_EXPIRATION:-24h}"
      COOKIE_HTTP_ONLY: "true"
      COOKIE_PARTITIONED: "${ANUBIS_COOKIE_PARTITIONED:-true}"
      COOKIE_SAME_SITE: "Lax"
      COOKIE_SECURE: "${ANUBIS_COOKIE_SECURE:-true}"
      ED25519_PRIVATE_KEY_HEX_FILE: "/run/secrets/anubis-ed25519"
      OG_PASSTHROUGH: "false"
      POLICY_FNAME: "/etc/anubis/botPolicy.yaml"
      SERVE_ROBOTS_TXT: "false"
      SLOG_LEVEL: "WARN"
      USE_SIMPLIFIED_EXPLANATION: "true"
    secrets:
      - source: anubis_ed25519
        target: anubis-ed25519
    volumes:
      - ./config/anubis/botPolicy.yaml:/etc/anubis/botPolicy.yaml:ro
      - ./data/anubis:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      redlib:
        condition: service_healthy
    networks:
      - services
    deploy:
      resources:
        limits:
          cpus: "${ANUBIS_CPU_LIMIT:-0.25}"
          memory: ${ANUBIS_MEMORY_LIMIT:-128M}
          pids: ${ANUBIS_PIDS_LIMIT:-128}
        reservations:
          memory: ${ANUBIS_MEMORY_RESERVATION:-32M}
    logging: *default-logging

  redlib:
    profiles: ["privacy-frontends"]
    build:
      context: ./config/redlib
      dockerfile: Dockerfile
      args:
        RUST_BUILDER_VERSION: "slim-bookworm@sha256:1469a27c125cb5a3aebfa4f4e4665d935b02fb72cc093b2c974b3d740e43f157"
        UBUNTU_RELEASE_VERSION: "noble@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517"
    image: ${REDLIB_IMAGE:-public-utility-redlib:0.36.0-a4d36e9-p1}
    # This tag exists only in the local image store. Build explicitly on first
    # install/update; routine `up` must not start another costly Rust build.
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    user: redlib
    <<: *default-security
    command: ["redlib", "-4", "-H", "0"]
    environment:
      TZ: ${TZ:-America/Guatemala}
      RUST_LOG: "warn"
      REDLIB_SFW_ONLY: ${REDLIB_SFW_ONLY:-off}
      REDLIB_BANNER: ${REDLIB_BANNER:-}
      REDLIB_ROBOTS_DISABLE_INDEXING: "on"
      REDLIB_DEFAULT_THEME: system
      REDLIB_DEFAULT_SHOW_NSFW: "off"
      REDLIB_DEFAULT_USE_HLS: "off"
      REDLIB_DEFAULT_AUTOPLAY_VIDEOS: "off"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=${REDLIB_TMPFS_SIZE:-32m},mode=1777
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /settings HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '^HTTP/1\\.[01] 200' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - services
    deploy:
      resources:
        limits:
          cpus: "${REDLIB_CPU_LIMIT:-0.50}"
          memory: ${REDLIB_MEMORY_LIMIT:-256M}
          pids: ${REDLIB_PIDS_LIMIT:-128}
        reservations:
          memory: ${REDLIB_MEMORY_RESERVATION:-32M}
    logging: *default-logging

  rimgo:
    profiles: ["optional"]
    image: codeberg.org/rimgo/rimgo:1.4.2@sha256:569800892522c7dd7d47290ce80d5c1fbb451609ce0d983c545a5d203ca93048
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    <<: *default-security
    ports:
      - target: 3000
        published: "${RIMGO_PORT:-3001}"
        host_ip: "${PRIVATE_BIND_IP:?Set PRIVATE_BIND_IP}"
        protocol: tcp
    environment:
      PORT: "3000"
      ADDRESS: "0.0.0.0"
      PROTOCOL_DETECTION: "1"
      SECURE: "1"
      FORCE_WEBP: "0"
      PRIVACY_POLICY: ${PUBLIC_PORTAL_ORIGIN:?Set PUBLIC_PORTAL_ORIGIN}/en/privacy
      PRIVACY_NOT_COLLECTED: "0"
      PRIVACY_IP: "1"
      PRIVACY_URL: "1"
      PRIVACY_DEVICE: "1"
      PRIVACY_DIAGNOSTICS: "1"
    networks:
      - services
    deploy:
      resources:
        limits:
          cpus: "${RIMGO_CPU_LIMIT:-0.50}"
          memory: ${RIMGO_MEMORY_LIMIT:-256M}
          pids: 128
        reservations:
          memory: 32M
    logging: *default-logging

networks:
  services:
    driver: bridge
  search-state:
    driver: bridge
    internal: true

volumes:
  searxng-cache:

secrets:
  cobalt_keys:
    file: ./secrets/cobalt-keys.json
  portal_cobalt_key:
    file: ./secrets/portal-cobalt-key
  anubis_ed25519:
    file: ./secrets/anubis-ed25519-key.hex
