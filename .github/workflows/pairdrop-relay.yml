name: PairDrop bounded relay check
on:
  workflow_dispatch:
    inputs:
      transport:
        description: Test only after the operator activates the separate relay
        type: choice
        options: [udp, tcp, tls]
        default: tls
permissions:
  contents: read
concurrency:
  group: utilibre-pairdrop-relay-check
  cancel-in-progress: false
jobs:
  synthetic-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Install the pinned browser driver
        run: npm install --prefix "$RUNNER_TEMP/pairdrop-check" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
      - name: Verify synthetic file through the native public application
        env:
          PAIRDROP_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/pairdrop-check/package.json
          PAIRDROP_CHROME: /usr/bin/google-chrome
          PAIRDROP_FORCE_RELAY: ${{ inputs.transport }}
        run: node deployment/community/check-pairdrop.mjs
