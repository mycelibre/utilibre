# Minimal overlay on the image's maintained defaults.
use_default_settings:
  engines:
    keep_only:
      - arxiv
      - askubuntu
      - bing
      - bing images
      - bing news
      - bing videos
      - currency
      - dailymotion
      - fynd
      - github
      - google cse
      - google cse images
      - mankier
      - mdn
      - mwmbl
      - photon
      - pubmed
      - reuters
      - semantic scholar
      - stackoverflow
      - superuser
      - wikicommons.images
      - wikicommons.videos
      - wikinews
      - wikipedia
      - wiktionary
      - wiby
      - youtube

# `keep_only` does not override an engine's upstream `disabled` flag. Explicit
# overrides below keep a small general-web mix enabled and weight the broad,
# bilingual contributor above niche indexes. Specialist engines remain in
# their own tabs and do not join an ordinary General search unless upstream
# assigns them to that category.
engines:
  - name: bing
    disabled: false
    weight: 1.0
  - name: fynd
    disabled: false
    # Fynd's current next-page URL carries `sx`/`psx` state in addition to the
    # numeric offset.  The generic XPath engine cannot preserve that state, so
    # advertising paging repeats page-one results.  Keep Fynd as a first-page
    # complement until its upstream SearXNG definition supports the cursor.
    paging: false
    weight: 0.8
  - name: google cse
    disabled: false
    weight: 3.0
  - name: mwmbl
    disabled: false
    # Fast independent complement, not a replacement for broad bilingual
    # results. Its small index has no language filter or pagination.
    weight: 0.3
  # These additions stay in their specialist tabs; they must not increase
  # upstream fan-out for an ordinary General search.
  - name: google cse images
    disabled: false
    categories: [images]
  - name: askubuntu
    disabled: false
    categories: [it, "q&a"]
  - name: superuser
    disabled: false
    categories: [it, "q&a"]
  - name: mankier
    disabled: false
    categories: [it]
  - name: wikipedia
    display_type:
      - infobox
      - list
    weight: 1.5
  - name: wiby
    disabled: false
    weight: 0.4

general:
  debug: false
  # The upstream UI has one instance name for every locale; keep it neutral.
  instance_name: "SearXNG"
  enable_metrics: false
  open_metrics: ""

brand:
  custom:
    links:
      "Volver a Utilibre": https://utilibre.org/es/
      "Back to Utilibre": https://utilibre.org/en/
      "Instance source": https://github.com/mycelibre/utilibre/tree/main/config/searxng

# Native opt-in preference. Host-only substitution cannot validate Reddit paths.
# No remove/high_priority/low_priority rules: result order stays upstream-owned.
plugins:
  searx.plugins.hostnames.SXNGPlugin:
    active: false
hostnames:
  replace:
    '^(www\.|old\.|new\.|np\.)?reddit\.com$': 'redlib.utilibre.org'

search:
  safe_search: 1
  autocomplete: ""
  favicon_resolver: ""
  default_lang: "auto"
  # Bound anonymous fan-out to the useful depth of the current broad-engine
  # mix. Google CSE already stops at five; beyond that only the niche Wiby
  # index contributes, and deeper requests add upstream load without a useful
  # comparison set.
  max_page: 5
  # This instance has one outbound identity. Give an upstream that refuses it
  # time to recover instead of retrying every three minutes and extending the
  # block. These values match the current public-instance guidance.
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
  formats:
    - html

server:
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: true
  public_instance: true
  image_proxy: true
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: true
  default_locale: ""
  query_in_title: false

outgoing:
  request_timeout: 4.0
  max_request_timeout: 12.0
  pool_connections: 50

valkey:
  url: valkey://valkey:6379/0
